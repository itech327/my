<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Storyboard · Sada</title>
<style>
  /* IBM Plex Sans Arabic, the brand font of the app. Arabic and Latin subsets. */
  @font-face { font-family: Brand; src: url("assets/fonts/PlexArabic-400-arabic.woff2"); font-weight: 400; unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE80-FEFC; }
  @font-face { font-family: Brand; src: url("assets/fonts/PlexArabic-600-arabic.woff2"); font-weight: 600 700; unicode-range: U+0600-06FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE80-FEFC; }
  @font-face { font-family: Brand; src: url("assets/fonts/PlexArabic-400-latin.woff2"); font-weight: 400; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Brand; src: url("assets/fonts/PlexArabic-700-latin.woff2"); font-weight: 600 700; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  * { box-sizing: border-box; } html, body { margin: 0; background: #0B0F1A; color: #f2f2f4; font-family: Brand, system-ui, sans-serif; }
  .board { width: 1920px; padding: 40px 30px; } h1 { margin: 0 0 6px; font-size: 42px; font-weight: 600; } h1 span { color: #8a8a94; font-weight: 400; }
  .sub { font-size: 18px; color: #b9b9c1; margin-bottom: 26px; max-width: 1700px; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(4, 450px); gap: 30px 26px; }
  .frame { position: relative; width: 450px; height: 253px; border-radius: 10px; overflow: hidden; background: #111827; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .num { position: absolute; right: 12px; top: 10px; width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #000; font-weight: 700; font-size: 22px; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .hl { position: absolute; left: 0; right: 0; top: 18px; text-align: center; font-weight: 600; font-size: 26px; z-index: 1; text-shadow: 0 1px 8px rgba(17,24,39,.9); }
  .t { font-size: 13px; color: #7d7d87; margin-top: 10px; direction: ltr; text-align: right; } .b { font-size: 19px; font-weight: 600; margin: 2px 0 4px; }
  .vo { margin-top: 6px; font-size: 15px; color: #8BA5FD; } .d { font-size: 14.5px; color: #b9b9c1; line-height: 1.6; }
  .mv { margin-top: 7px; font-size: 14px; color: #F5D04E; line-height: 1.55; } .tr { margin-top: 7px; font-size: 14px; color: #1FE39A; line-height: 1.55; }
</style></head><body>
<div class="board"><h1>صدى <span>· إعلان 15 ثانية · القصة المصورة</span></h1>
  <div class="sub">أصوات مغربية بالدارجة وبالفصحى من النص، للمعلمين وصنّاع المحتوى. الأزرق: التعليق الصوتي بصوت يونس. الأصفر: ما يتحرك. الأخضر: كيف يتحول هذا المشهد إلى التالي. اللقطات الحقيقية للتطبيق ستحل محل هذه الإطارات التقريبية.</div>
  <div class="grid" id="g"></div></div>
<script>
// [time, frame image, field colour, headline on the frame, title, VO line, description, motion, transition]
const S = [
  ['0.0–1.6 s', 'storyboard/frames/1.jpg', '#111827', '', 'الصدى', '', 'خلفية داكنة، وموجة صوتية حية في الوسط، وأعمدة الشعار الثلاثة أوضحها.', 'الأعمدة تنبض بإيقاع كلام، من الوسط إلى الأطراف.', 'الموجة تنكمش في الوسط، وخطها يصير سطر الكتابة في البطاقة.'],
  ['1.6–3.8 s', 'storyboard/frames/2.jpg', '#111827', 'اكتب نصك.', 'النص', '', 'بطاقة بيضاء تنبثق من الموجة، ويُكتب فيها سطر بالعربية كلمة كلمة: «الكسور والنسب المئوية».', 'كل كلمة تظهر من الضبابية إلى الوضوح مع ارتفاع طفيف. تقريب بطيء من الكاميرا.', 'البطاقة تكبر حتى تصير شاشة المحرر الحقيقية.'],
  ['3.8–6.2 s', 'storyboard/frames/3.jpg', '#111827', '', 'المحرر', '«كتب النص ديالك، واختار الصوت.»', 'لقطة المحرر الحقيقية. الكاميرا تدفع ببطء نحو صندوق النص.', 'دفع مستمر واحد بلا رجوع. المؤشر يومض في النص.', 'نبقى على الدفع، فتنزاح الكاميرا إلى قائمة الأصوات على اليمين.'],
  ['6.2–8.6 s', 'storyboard/frames/4.jpg', '#111827', 'اختر الصوت.', 'الأصوات', '', 'بطاقتا نور ويونس، وتحتهما مفتاح «دارجة / فصحى بنفَس مغربي».', 'حلقة الاختيار تنتقل من نور إلى يونس باتجاه واحد، ثم المفتاح ينزلق إلى «فصحى».', 'بطاقة يونس تتحول إلى دائرة زر التشغيل.'],
  ['8.6–11.4 s', 'storyboard/frames/5.jpg', '#111827', 'واستمع.', 'التشغيل', '«صدى: كيهضر بالدارجة وبالفصحى.»', 'زر التشغيل دائرة بيضاء في الوسط، وشريط الصوت يمتلئ.', 'الدائرة تنضغط 8٪ ثم تكبر حتى تملأ الإطار بلون الخلفية التالية.', 'الدائرة الممتلئة تنفتح فتظهر الأعمدة الثلاثة في مركزها.'],
  ['11.4–13.0 s', 'storyboard/frames/6.jpg', '#111827', 'صوت مغربي من نصك.', 'الشعار', '', 'أعمدة الشعار الثلاثة في الوسط، وتحتها الجملة تظهر كلمة كلمة.', 'الأعمدة تدور في مكانها ثم ترتفع قليلاً لتفسح مكاناً للنهاية.', 'الأعمدة تصعد وتصغر، ويظهر شريط البحث تحتها.'],
  ['13.0–15.0 s', 'storyboard/frames/7.jpg', '#111827', '', 'النهاية', '', 'الشعار صغير في الأعلى، وشريط بحث في الوسط يكتب العنوان حرفاً حرفاً مع مؤشر يومض: voice.taalim.men. الكلمة «صدى» تحت الشريط.', 'الكتابة الحرفية فقط، ثم تثبت. لا حركة كاميرا في آخر مشهد.', 'نهاية الإعلان.'],
];
document.getElementById('g').innerHTML = S.map(([t, img, bg, hl, b, vo, d, mv, tr], i) => `<div><div class="frame" style="background:${bg}"><div class="num">${i + 1}</div>${img ? `<img src="${img}">` : ''}${hl ? `<div class="hl">${hl}</div>` : ''}</div>
  <div class="t">${t}</div><div class="b">${b}</div>${vo ? `<div class="vo">${vo}</div>` : ''}<div class="d">${d}</div>${mv ? `<div class="mv">${mv}</div>` : ''}<div class="tr">← ${tr}</div></div>`).join('');
</script></body></html>
