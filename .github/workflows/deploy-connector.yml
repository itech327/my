# Deploys the Claude connector Worker (connector/) to Cloudflare on each push
# that touches it or the shared voice code. Needs repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Settings > Secrets and variables > Actions).
# The Worker's own secrets (GEMINI_API_KEY, MCP_ACCESS_KEY) live in Cloudflare, not here.
name: Deploy connector
on:
  push:
    branches: [claude/new-session-thirii]
    paths:
      - connector/**
      - app/src/lib/delivery.ts
      - app/src/lib/rewrite-core.ts
      - app/src/lib/tts/gemini.ts
      - app/src/lib/tts/designed-voices.json
      - .github/workflows/deploy-connector.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-connector
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install
        working-directory: connector
        run: npm ci
      - name: Typecheck
        working-directory: connector
        run: npx tsc --noEmit
      - name: Deploy
        working-directory: connector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
