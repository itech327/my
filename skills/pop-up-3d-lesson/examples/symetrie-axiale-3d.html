<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>التماثل المحوري · La symétrie axiale</title>
<style>
  :root{--paper:#fbfaf6;--ink:#2a2a2e;--blue:#2f5bd3;--orange:#e8710a;--red:#d1153f}
  *{box-sizing:border-box;min-width:0}
  html,body{margin:0;height:100%;background:#5c4029;overflow:hidden;font-family:"Noto Naskh Arabic","Geeza Pro",Arial,sans-serif;color:var(--ink)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .top{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding-bottom:2px}
  .row::-webkit-scrollbar{display:none}
  .chip,.btn{flex:none;font:700 15px "Noto Naskh Arabic","Geeza Pro",Arial,sans-serif;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:6px 12px;min-height:40px;box-shadow:2px 2px 0 rgba(0,0,0,.3);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--ink);color:var(--paper)}
  .sub .chip{font-size:14px;min-height:36px;padding:4px 10px;border-width:1.5px}
  .btn.acc{background:var(--red);border-color:var(--red);color:#fff}
  .chip:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .hud{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none;display:flex;flex-direction:column;gap:7px;align-items:center}
  .acts{display:flex;gap:8px;pointer-events:auto}
  .cards{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .card{background:var(--paper);border:1.5px solid #3a3a40;border-radius:4px;padding:4px 9px 3px;box-shadow:2px 3px 0 rgba(0,0,0,.25);min-width:80px;text-align:center;transform:rotate(var(--r,0deg))}
  .card[hidden]{display:none}
  .card small{display:block;font-size:13px;color:#555;unicode-bidi:plaintext}
  .card b{font:700 20px/1.15 "Comic Sans MS","Chalkboard SE","Marker Felt",cursive;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
  .card b i{font-style:normal;font-size:14px;color:#555;margin-left:3px}
  #notice{background:rgba(251,250,246,.95);border-radius:8px;padding:6px 14px;font-size:15px;max-width:660px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  #notice b{color:var(--red)}
  #err{position:fixed;top:110px;left:12px;right:12px;background:#fff;border:2px solid var(--red);padding:10px;display:none;font-size:14px;direction:ltr;z-index:9}
  #notice{min-height:3.2em;display:flex;align-items:center;justify-content:center}
  @media (orientation:landscape) and (max-height:600px){
    .cards{position:fixed;left:calc(8px + env(safe-area-inset-left));flex-direction:column;align-items:stretch;gap:5px;pointer-events:none}
    .card{min-width:0;padding:2px 8px;transform:none}.card b{font-size:15px}.card small{font-size:11px}
    .hud{padding-left:calc(170px + env(safe-area-inset-left));gap:5px}
    #notice{font-size:13px;min-height:2.6em;padding:4px 12px}
    .chip,.btn{min-height:36px;padding:4px 10px;font-size:14px}
  }
  @media (max-width:520px){.card{min-width:68px;padding:3px 6px}.card b{font-size:16px}.card small{font-size:12px}#notice{font-size:13.5px}}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c" aria-label="Symétrie axiale 3D"></canvas>
<div class="top">
  <div class="row" id="modes"></div>
  <div class="row sub" id="subs"></div>
</div>
<div class="hud">
  <div class="acts" id="acts"></div>
  <div class="cards">
    <div class="card" id="k0" style="--r:-2deg"><small></small><b></b></div>
    <div class="card" id="k1" style="--r:1.5deg"><small></small><b></b></div>
    <div class="card" id="k2" style="--r:-1deg"><small></small><b></b></div>
    <div class="card" id="k3" style="--r:2deg"><small></small><b></b></div>
  </div>
  <div id="notice"></div>
</div>
<div id="err"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = 'Error: ' + e.message; });

/* =========================================================
   Units: 1 world unit = 1 cm. Page coordinates (x, z) are a
   2D plane: x to the right, z toward the reader.
   ========================================================= */
const PAGE_Y = 1.2;
const RECT = { x0: 2, x1: 19, z0: -11.5, z1: 5.5 };
const P0 = new THREE.Vector2(11, -3);          // a grid node on the axis (d)
const H_SHAPE = 0.3, Y0 = PAGE_Y + 0.01, YA = Y0 + H_SHAPE / 2;
const YL = PAGE_Y + 0.035;                      // drawing height for lines on the page
const TRACK = { x0: 3, x1: 11, z: 9 }, SW = { x: 16.5, z: 9 };
const THETA_MAX = 90;

/* ---------- State ---------- */
const S = {
  lang: 'ar', mode: 'tri', theta: 0, foldOn: false, phi: 0,
  drag: null, dragOff: new THREE.Vector2(), handles: [],
  lastAction: 'idle', actionTime: 0,
  tri: null, trail: [],
  pred: null, shp: null, med: null, fig: null, con: null,
};
// In Arabic text, isolate each Latin expression (A', [MM'], AH = A'H = 3,2 cm) so it keeps its left-to-right order.
const isoLatin = t => t.replace(/[\[(A-Za-z][A-Za-z0-9'()\[\]=·⊥,. ]*[A-Za-z0-9')\]]/g, m => '\u2066' + m + '\u2069');
const tr = (ar, fr) => S.lang === 'ar' ? isoLatin(ar) : fr;
const V = (x, z) => new THREE.Vector2(x, z);
function initState() {
  S.theta = 0; S.foldOn = false; S.phi = 0; S.trail = [];
  S.tri = [V(5, -6), V(8, -4.2), V(5.6, -1)];
  S.pred = { A: V(6, -6), G: V(16, 3), checked: false, score: 0, tries: 0 };
  S.shp = { kind: 'seg', P: { seg: [V(5, -7), V(8, -2)], line: [V(5, -7), V(8, -3)], circle: [V(6, -4), V(8.5, -4)], angle: [V(5, -3), V(8, -7), V(8.5, -1)] } };
  S.med = { A: V(6, -6), t: -4 };
  S.fig = { kind: 'square', found: new Set(), lo: 0, hi: 0 };
  S.con = { A: V(7, -5), step: 0, t0: 0 };
}
initState();

/* ---------- Geometry (exact, recomputed every frame) ---------- */
const axisDir = () => { const t = THREE.MathUtils.degToRad(S.theta); return V(Math.sin(t), -Math.cos(t)); };
function project(M, u) { const d = (M.x - P0.x) * u.x + (M.y - P0.y) * u.y; return V(P0.x + d * u.x, P0.y + d * u.y); }
function reflect(M, u) { const H = project(M, u); return V(2 * H.x - M.x, 2 * H.y - M.y); }
function side(M, u) { return u.x * (M.y - P0.y) - u.y * (M.x - P0.x); }
const cross = (a, b, c) => (b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x);
function angleAt(a, b, c) { const u1 = V(b.x - a.x, b.y - a.y), u2 = V(c.x - a.x, c.y - a.y); const l = u1.length() * u2.length(); return l < 1e-9 ? 0 : THREE.MathUtils.radToDeg(Math.acos(THREE.MathUtils.clamp(u1.dot(u2) / l, -1, 1))); }
function clipLine(p, d) { // slab clip of p + t d to RECT
  let tmin = -1e9, tmax = 1e9;
  const sl = (q, dd, a, b) => { if (Math.abs(dd) < 1e-9) { if (q < a || q > b) { tmin = 1; tmax = 0; } return; } const t1 = (a - q) / dd, t2 = (b - q) / dd; tmin = Math.max(tmin, Math.min(t1, t2)); tmax = Math.min(tmax, Math.max(t1, t2)); };
  sl(p.x, d.x, RECT.x0, RECT.x1); sl(p.y, d.y, RECT.z0, RECT.z1);
  return [tmin, tmax];
}
function rotHinge(p, k, phi) { // Rodrigues rotation around the fold hinge
  const v = new THREE.Vector3(p.x - P0.x, p.y - YA, p.z - P0.y), c = Math.cos(phi), s = Math.sin(phi);
  const kxv = new THREE.Vector3().crossVectors(k, v), kd = k.dot(v);
  return new THREE.Vector3(v.x * c + kxv.x * s + k.x * kd * (1 - c) + P0.x, v.y * c + kxv.y * s + k.y * kd * (1 - c) + YA, v.z * c + kxv.z * s + k.z * kd * (1 - c) + P0.y);
}
function halfRect(u, sgn) {
  const R = [V(RECT.x0, RECT.z0), V(RECT.x1, RECT.z0), V(RECT.x1, RECT.z1), V(RECT.x0, RECT.z1)], out = [];
  for (let i = 0; i < 4; i++) { const a = R[i], b = R[(i + 1) % 4], sa = sgn * side(a, u), sb = sgn * side(b, u);
    if (sa >= 0) out.push(a);
    if ((sa >= 0) !== (sb >= 0)) { const t = sa / (sa - sb); out.push(V(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t)); } }
  return out;
}
const clampRect = (v, m = 0.4) => { v.x = THREE.MathUtils.clamp(v.x, RECT.x0 + m, RECT.x1 - m); v.y = THREE.MathUtils.clamp(v.y, RECT.z0 + m, RECT.z1 - m); return v; };
const inRect = (v, m = 0.4) => v.x >= RECT.x0 + m && v.x <= RECT.x1 - m && v.y >= RECT.z0 + m && v.y <= RECT.z1 - m;

/* ---------- Renderer ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x5c4029);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 600);
scene.add(new THREE.HemisphereLight(0xfffaf0, 0x6b4a2f, 1.1));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
sun.position.set(-30, 60, 25); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -35, right: 35, top: 30, bottom: -30, near: 10, far: 150 }); sun.shadow.bias = -0.0008;
scene.add(sun);

/* ---------- Canvas textures ---------- */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; }
const AR_FONT = '"Noto Naskh Arabic","Geeza Pro",Arial,serif', HAND = '"Comic Sans MS","Chalkboard SE","Marker Felt",cursive';
function woodTexture() {
  const [c, g] = makeCanvas(1024, 1024); g.fillStyle = '#8a5f3c'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 260; i++) { const y = Math.random() * 1024, a = 0.05 + Math.random() * 0.12;
    g.strokeStyle = Math.random() < .5 ? `rgba(60,35,18,${a})` : `rgba(190,140,95,${a})`; g.lineWidth = 1 + Math.random() * 3;
    g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= 1024; x += 32) g.lineTo(x, y + Math.sin(x / 90 + i) * 6 + Math.sin(x / 23 + i * 3) * 1.5); g.stroke(); }
  const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2, 2); return t;
}
function paperBase(g, w, h, spineRight) {
  g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(120,110,90,${Math.random() * .05})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.strokeStyle = 'rgba(80,80,90,.10)'; g.lineWidth = 1.2;
  for (let i = -h; i < h; i += 7) { const x0 = spineRight ? w - 60 : 0; g.beginPath(); g.moveTo(x0, i); g.lineTo(x0 + 60, i + 60); g.stroke(); }
}
function leftPageTexture() {
  const W = 1000, H = 1300, [c, g] = makeCanvas(W, H); paperBase(g, W, H, true);
  const ar = S.lang === 'ar', X = ar ? W - 90 : 90;
  g.direction = ar ? 'rtl' : 'ltr'; g.textAlign = ar ? 'right' : 'left'; g.fillStyle = '#26262b';
  g.font = `700 ${ar ? 84 : 76}px ${AR_FONT}`; g.fillText(tr('التماثل المحوري', 'La symétrie axiale'), X, 200);
  g.strokeStyle = '#d1153f'; g.lineWidth = 4; g.beginPath(); g.moveTo(X, 232); g.lineTo(ar ? X - 430 : X + 430, 236); g.stroke();
  g.font = `700 ${ar ? 50 : 42}px ${AR_FONT}`;
  g.fillText(tr("M' مماثلة M بالنسبة للمستقيم (d)", "M' est le symétrique de M par rapport à (d)"), X, 360);
  g.fillText(tr("يعني: (d) واسط القطعة [MM']", "signifie : (d) est la médiatrice de [MM']"), X, 440);
  g.direction = 'ltr'; g.textAlign = 'center'; g.font = `700 60px ${HAND}`; g.fillStyle = '#2f5bd3';
  g.fillText("HM = HM'   et   (MM') ⊥ (d)", W / 2, 580);
  g.direction = ar ? 'rtl' : 'ltr'; g.textAlign = ar ? 'right' : 'left'; g.fillStyle = '#26262b'; g.font = `${ar ? 44 : 38}px ${AR_FONT}`;
  const lines = (ar ? ['١. التماثل يحافظ على الأطوال والزوايا والمساحات.', '٢. لكنه يقلب اتجاه الدوران.', "٣. كل نقطة من (d) تبعد بنفس المسافة عن M وM'."]
                   : ['1. Elle conserve longueurs, angles et aires.', '2. Mais elle inverse le sens de rotation.', "3. Tout point de (d) est à égale distance de M et M'."]).map(l => ar ? isoLatin(l) : l);
  lines.forEach((l, i) => g.fillText(l, X, 760 + i * 110));
  g.font = `${ar ? 34 : 30}px ${AR_FONT}`; g.fillStyle = '#6a6a72';
  g.fillText(tr('اسحب النقط بإصبعك، واسحب الفراغ لتدوير الكتاب.', 'Fais glisser les points ; glisse dans le vide pour tourner.'), X, 1170);
  return tex(c);
}
const PX = 48;
function rightPageTexture() {
  const W = 20 * PX, H = 26 * PX, [c, g] = makeCanvas(W, H); paperBase(g, W, H, false);
  const X = x => (x - 0.5) * PX, Z = z => (z + 13) * PX;
  g.strokeStyle = 'rgba(70,90,130,.18)'; g.lineWidth = 1;
  for (let x = RECT.x0; x <= RECT.x1; x++) { g.beginPath(); g.moveTo(X(x), Z(RECT.z0)); g.lineTo(X(x), Z(RECT.z1)); g.stroke(); }
  for (let z = RECT.z0; z <= RECT.z1; z++) { g.beginPath(); g.moveTo(X(RECT.x0), Z(z)); g.lineTo(X(RECT.x1), Z(z)); g.stroke(); }
  g.strokeStyle = 'rgba(40,40,45,.55)'; g.lineWidth = 2; g.strokeRect(X(RECT.x0), Z(RECT.z0), (RECT.x1 - RECT.x0) * PX, (RECT.z1 - RECT.z0) * PX);
  g.fillStyle = '#26262b'; g.direction = S.lang === 'ar' ? 'rtl' : 'ltr'; g.textAlign = 'center'; g.font = `700 32px ${AR_FONT}`;
  g.fillText(tr('ميل المحور (d)', "Inclinaison de l'axe (d)"), X((TRACK.x0 + TRACK.x1) / 2), Z(TRACK.z - 1.3));
  g.fillText(tr('طيّ الورقة', 'Plier la feuille'), X(SW.x), Z(SW.z - 1.3));
  g.direction = 'ltr'; g.font = `26px ${HAND}`; g.fillStyle = '#555';
  g.fillText('-90°', X(TRACK.x0), Z(TRACK.z + 1.6)); g.fillText('0°', X((TRACK.x0 + TRACK.x1) / 2), Z(TRACK.z + 1.6)); g.fillText('90°', X(TRACK.x1), Z(TRACK.z + 1.6));
  g.strokeStyle = '#444'; g.lineWidth = 2;
  for (let i = 0; i <= 12; i++) { const x = X(TRACK.x0 + (TRACK.x1 - TRACK.x0) * i / 12); g.beginPath(); g.moveTo(x, Z(TRACK.z + .55)); g.lineTo(x, Z(TRACK.z + (i % 6 ? .8 : 1))); g.stroke(); }
  return tex(c);
}

/* ---------- Desk and book ---------- */
const pencil = new THREE.LineBasicMaterial({ color: 0x4a4a52 });
function withEdges(mesh, thr = 20) { mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, thr), pencil)); return mesh; }
const desk = new THREE.Mesh(new THREE.PlaneGeometry(260, 200), new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: .75 }));
desk.rotation.x = -Math.PI / 2; desk.receiveShadow = true; scene.add(desk);
const cover = new THREE.Mesh(new THREE.BoxGeometry(43, 0.35, 28.4), new THREE.MeshStandardMaterial({ color: 0x7b2d26, roughness: .8 }));
cover.position.set(0, 0.175, 0); cover.castShadow = cover.receiveShadow = true; scene.add(cover);
const edgeMat = new THREE.MeshStandardMaterial({ color: 0xf1ede2, roughness: .95 });
const rightTop = new THREE.MeshStandardMaterial({ map: rightPageTexture(), roughness: .95 });
const leftTop = new THREE.MeshStandardMaterial({ map: leftPageTexture(), roughness: .95 });
const rightPage = withEdges(new THREE.Mesh(new THREE.BoxGeometry(20, PAGE_Y - 0.35, 26), [edgeMat, edgeMat, rightTop, edgeMat, edgeMat, edgeMat]));
rightPage.position.set(10.5, 0.35 + (PAGE_Y - 0.35) / 2, 0); rightPage.receiveShadow = rightPage.castShadow = true; scene.add(rightPage);
const leftPage = withEdges(new THREE.Mesh(new THREE.BoxGeometry(20, PAGE_Y - 0.35, 26), [edgeMat, edgeMat, leftTop, edgeMat, edgeMat, edgeMat]));
leftPage.position.set(-10.5, 0.35 + (PAGE_Y - 0.35) / 2 + 0.25, 0); leftPage.rotation.z = 0.025; leftPage.receiveShadow = leftPage.castShadow = true; scene.add(leftPage);
function refreshPages() { rightTop.map.dispose(); rightTop.map = rightPageTexture(); leftTop.map.dispose(); leftTop.map = leftPageTexture(); rightTop.needsUpdate = leftTop.needsUpdate = true; }

/* ---------- Immediate-mode drawing pools ---------- */
function makeSegEntry(max) {
  const geo = new THREE.BufferGeometry(), attr = new THREE.BufferAttribute(new Float32Array(max * 18), 3);
  geo.setAttribute('position', attr);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
  mesh.frustumCulled = false; mesh.renderOrder = 2; mesh.visible = false; scene.add(mesh);
  return { mesh, geo, attr, max };
}
const smallPool = Array.from({ length: 28 }, () => makeSegEntry(64)), bigPool = Array.from({ length: 4 }, () => makeSegEntry(400));
let smallUsed = 0, bigUsed = 0;
// segs: [[x1,z1,x2,z2], ...] drawn as flat ribbons on the page
function drawSegs(segs, color, w = 0.12, y = YL, opacity = 1) {
  const big = segs.length > 64, pool = big ? bigPool : smallPool, idx = big ? bigUsed++ : smallUsed++;
  if (idx >= pool.length) return;
  const e = pool[idx], A = e.attr.array, n = Math.min(segs.length, e.max); let k = 0;
  for (let i = 0; i < n; i++) {
    const [x1, z1, x2, z2] = segs[i], dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz); if (L < 1e-6) continue;
    const nx = -dz / L * w / 2, nz = dx / L * w / 2;
    const q = [x1 + nx, z1 + nz, x1 - nx, z1 - nz, x2 - nx, z2 - nz, x2 + nx, z2 + nz];
    for (const j of [0, 1, 2, 0, 2, 3]) { A[k++] = q[2 * j]; A[k++] = y; A[k++] = q[2 * j + 1]; }
  }
  e.geo.setDrawRange(0, k / 3); e.attr.needsUpdate = true;
  e.mesh.material.color.set(color); e.mesh.material.opacity = opacity; e.mesh.visible = true;
}
const polySegs = (pts, closed) => { const s = []; for (let i = 0; i < pts.length - (closed ? 0 : 1); i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; s.push([a.x, a.y, b.x, b.y]); } return s; };
function dashSegs(a, b, dash = .35, gap = .25) { const L = a.distanceTo(b), s = []; for (let t = 0; t < L; t += dash + gap) { const t2 = Math.min(L, t + dash); s.push([a.x + (b.x - a.x) * t / L, a.y + (b.y - a.y) * t / L, a.x + (b.x - a.x) * t2 / L, a.y + (b.y - a.y) * t2 / L]); } return s; }
function arcPts(c, r, a0, a1, n = 40) { const p = []; for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; p.push(V(c.x + r * Math.cos(a), c.y + r * Math.sin(a))); } return p; }
function arrowArc(c, r, dir, color, y) { // 270° arc with an arrow head; dir>0 = clockwise on screen
  const a0 = -Math.PI / 2, a1 = a0 + dir * 1.5 * Math.PI, pts = arcPts(c, r, a0, a1, 36), tip = pts[pts.length - 1];
  const tg = V(-Math.sin(a1) * dir, Math.cos(a1) * dir), hs = [];
  for (const s of [1, -1]) { const ang = Math.atan2(tg.y, tg.x) + Math.PI + s * 0.5; hs.push([tip.x, tip.y, tip.x + 0.35 * Math.cos(ang), tip.y + 0.35 * Math.sin(ang)]); }
  drawSegs(polySegs(pts, false).concat(hs), color, 0.09, y);
}

  /* 6: axes of symmetry of figures, with a standing mirror */

    verts(kind) {

      card(2, "A'H", st >= 4 ? fmt(A2.distanceTo(H)) + unit('cm') : '?'); card(3, tr("(AA') و (d)", "(AA') et (d)"), st >= 2 ? '90' + unit('°') : '?');
      const dx = A.x - H.x, dz = A.y - H.y, num = v => fmt(Math.abs(v), Math.abs(Math.abs(v) - Math.round(Math.abs(v))) < 0.05 ? 0 : 1);
      const hz = (v, inv) => ((v > 0) !== inv ? tr('يمينًا', 'à droite') : tr('يسارًا', 'à gauche')), vt = (v, inv) => ((v > 0) !== inv ? tr('نحو الأسفل', 'vers le bas') : tr('نحو الأعلى', 'vers le haut'));
      const mv = inv => { const parts = []; if (Math.abs(dx) > 0.05) parts.push(`${num(dx)} ${hz(dx, inv)}`); if (Math.abs(dz) > 0.05) parts.push(`${num(dz)} ${vt(dz, inv)}`); return parts.join(tr(' و', ' et ')); };
      const T = [
        tr("نريد إنشاء A' مماثلة A بالنسبة لـ (d). اضغط «الخطوة التالية». يمكنك سحب A.", "On veut construire A', symétrique de A par rapport à (d). Appuie sur « Étape suivante ». Tu peux déplacer A."),
        tr('ضع الكوس على (d) ومرّره من A، ثم ارسم العمودي على (d) المار من A.', "Place l'équerre sur (d), fais-la passer par A et trace la perpendiculaire à (d) passant par A."),
        tr('H هي نقطة تقاطع العمودي مع (d).', "H est le point d'intersection de la perpendiculaire avec (d)."),
        tr('افتح البركار: الرأس في H والقلم في A.', 'Ouvre le compas : pointe en H, mine en A.'),
        tr("دون تغيير الفتحة، ارسم قوسًا في الجهة الأخرى: يقطع العمودي في A'.", "Sans changer l'écartement, trace l'arc de l'autre côté : il coupe la perpendiculaire en A'."),
        tr(`على الشبكة، بعدد المربعات: من H إلى A: ${mv(false)}. ومن H إلى A': ${mv(true)}. الإزاحة معكوسة تمامًا.`, `Sur le quadrillage, en carreaux : de H à A, ${mv(false)} ; de H à A', ${mv(true)}. Le déplacement est exactement inversé.`)];
      notice(T[st]);
    }
  },
};

/* ---------- Frame loop ---------- */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();
  if (intro) { const k = Math.min(1, (now - intro.t0) / intro.dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(intro.from, home.pos, e); camera.lookAt(home.target);
    if (k >= 1) { intro = null; orbit.enabled = true; orbit.target.copy(home.target); orbit.update(); } } else orbit.update();

  const goal = S.foldOn ? 180 : 0; S.phi += Math.sign(goal - S.phi) * Math.min(Math.abs(goal - S.phi), 90 * dt);

  smallUsed = bigUsed = dotUsed = labUsed = 0;
  for (const p of [prOrig, prImg, prTool]) p.mesh.visible = p.edges.visible = false;
  flap.visible = false; mirror.visible = false; compass.visible = false;

  const u = axisDir(), M = MODES[S.mode];
  M.draw(u, now);
  S.handles = M.handles(u);

  // controls on the page
  const knobOn = S.mode !== 'pred', swOn = S.mode === 'tri';
  knob.visible = trackMesh.visible = knobHit.userData.on = knobOn; swBase.visible = swKnob.visible = swHit.userData.on = swOn;
  const kx = TRACK.x0 + (S.theta / THETA_MAX + 1) / 2 * (TRACK.x1 - TRACK.x0);
  knob.position.set(kx, PAGE_Y + 0.47, TRACK.z); knobHit.position.copy(knob.position);
  if (knobOn) drawLabel((S.theta > 0 ? '+' : '') + S.theta + '°', RED, kx, PAGE_Y + 1.8, TRACK.z - 0.4);
  swX += ((S.foldOn ? SW.x + 0.8 : SW.x - 0.8) - swX) * Math.min(1, dt * 12);
  swKnob.position.set(swX, PAGE_Y + 0.55, SW.z); swKnob.material.color.set(S.foldOn ? 0xd1153f : 0xbdbdc4);

  for (let i = smallUsed; i < smallPool.length; i++) smallPool[i].mesh.visible = false;
  for (let i = bigUsed; i < bigPool.length; i++) bigPool[i].mesh.visible = false;
  for (let i = dotUsed; i < dotPool.length; i++) dotPool[i].visible = false;
  for (let i = labUsed; i < labPool.length; i++) labPool[i].visible = false;

  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
resize(); buildHUD(); startIntro(); requestAnimationFrame(frame);
</script>
