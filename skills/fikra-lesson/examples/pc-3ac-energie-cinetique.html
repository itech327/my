<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>L'énergie cinétique et la distance d'arrêt · Le concept en main</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* STYLE:BEGIN · Le concept en main · engine v1 · do not edit in a lesson */
:root{color-scheme:light dark;--bg:light-dark(#FBFAF6,#11151e);--ink:light-dark(#1b2440,#ebe7db);--soft:light-dark(#5d647a,#a3a9bb);--card:light-dark(#fff,#191e2a);--line:light-dark(#dcd8cb,#2c3243);--glow:#f5a300;--heat:#ff4b2b;--blue:light-dark(#2f5bd3,#86a8ff);--ok:light-dark(#1f7a4d,#5fd39a);--bad:light-dark(#c0392b,#ff7b6b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:860px;margin:0 auto;padding:0 max(4vw,14px)}
h1,h2,h3,.hand{font-family:Kalam,"Comic Sans MS",cursive;font-weight:700;line-height:1.1;margin:0}
h1{font-size:clamp(30px,6vw,44px)}h2{font-size:26px;margin:2px 0 8px}h3{font-size:20px;margin:12px 0 6px}
p{margin:6px 0}
.ar{font-family:"Noto Naskh Arabic",serif;direction:rtl;text-align:right;color:var(--soft);font-size:17px;margin:4px 0}
.num{font:700 15px Kalam,cursive;color:var(--soft)}
.note{font-size:13px;color:var(--soft)}
header{padding:20px 0 6px}
.steps{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(4px);border-bottom:1px solid var(--line)}
.steps .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
.steps button{flex:none;min-height:36px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--soft);font:700 14px "Atkinson Hyperlegible",sans-serif;padding:0 10px;cursor:pointer}
.steps button.done{border-color:var(--ok);color:var(--ok)}
.steps button.cur{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.steps button:disabled{opacity:.45;cursor:default}
section.moment{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px;margin:16px 0;scroll-margin-top:60px}
section.moment[hidden]{display:none}
button.b{font:700 16px "Atkinson Hyperlegible",sans-serif;min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
button.b.primary{background:var(--ink);color:var(--bg)}
button.b:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.opts button{font:700 16px "Atkinson Hyperlegible",sans-serif;min-height:44px;padding:8px 14px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);cursor:pointer}
.opts button.pick{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--card))}
.opts button:disabled{cursor:default}
.q{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.q:first-child{border-top:0;margin-top:0;padding-top:0}
.fig{width:100%;display:block}
.ink{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.card{border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;text-align:center}
.card small{display:block;color:var(--soft);font-size:13px}
.card b{font:700 20px Kalam,cursive;white-space:nowrap}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px 20px}
label{display:block;font-weight:700}
label span{font-weight:400;color:var(--soft);white-space:nowrap}
input[type=range]{width:100%;height:40px;accent-color:var(--blue)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.seg button{min-height:40px;padding:4px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 14px "Atkinson Hyperlegible",sans-serif;cursor:pointer}
.seg button.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.bars{display:grid;gap:4px;margin-top:6px;font-size:14px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.missions{list-style:none;padding:0;margin:8px 0}
.missions li{padding:4px 0 4px 30px;position:relative}
.missions li::before{content:"";position:absolute;left:0;top:7px;width:18px;height:18px;border:2px solid var(--line);border-radius:5px}
.missions li.ok::before{border-color:var(--ok);background:var(--ok)}
.rule{border:2.5px solid var(--ink);border-radius:14px;padding:12px 14px;margin:8px 0}
.formula{font:700 clamp(24px,6vw,34px) Kalam,cursive;margin:4px 0}
.flapw{position:relative;margin-top:8px;border-radius:12px;overflow:hidden;min-height:140px}
.proof{padding:12px;border:1.5px dashed var(--line);border-radius:12px}
.flap{position:absolute;inset:0;width:100%;border-radius:12px;border:2px solid var(--ink);background:repeating-linear-gradient(135deg,var(--card) 0 10px,color-mix(in srgb,var(--line) 70%,var(--card)) 10px 12px);transform-origin:top;transition:transform .7s,opacity .7s;font:700 19px Kalam,cursive;color:var(--ink);cursor:pointer}
.flap.open{transform:rotateX(-100deg);opacity:0;pointer-events:none}
.verdict{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:15px}
.verdict.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.verdict.no{background:color-mix(in srgb,var(--bad) 12%,transparent)}
.ex{border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-top:8px}
.ex input{font:16px "Atkinson Hyperlegible",sans-serif;min-height:44px;padding:6px 10px;border:2px solid var(--line);border-radius:10px;width:9em;background:var(--card);color:var(--ink)}
.fb{min-height:1.4em;margin-top:6px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.report{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.report .card b{font-size:26px}
select{font:16px "Atkinson Hyperlegible",sans-serif;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:4px 8px}
#problems{border:2px solid var(--bad);border-radius:12px;padding:10px;margin:12px 0;font-size:14px}
footer{padding:20px 0 40px}
@media(max-width:560px){.report{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* STYLE:END */
</style>
</head>
<body>
<header><div class="wrap" id="hd"></div></header>
<nav class="steps" aria-label="Moments de la leçon"><div class="wrap" id="steps"></div></nav>
<main class="wrap" id="main"></main>
<footer><div class="wrap note" id="ft"></div></footer>

<script>
/* LESSON:BEGIN · Physique-Chimie 3AC · L'énergie cinétique et la distance d'arrêt */
const CAR = `<path class="ink" fill="var(--card)" d="M-84 154 L-84 134 Q-83 127 -74 126 L-62 126 L-52 109 Q-49 104 -42 104 L-26 104 Q-19 104 -15 111 L-8 126 Q0 127 0 136 L0 154 Z"/><path class="ink" style="stroke-width:1.8" d="M-58 126 L-50 112 L-38 112 L-38 126 Z M-34 126 L-34 112 L-22 112 L-16 126 Z"/><circle class="ink" fill="var(--card)" cx="-62" cy="158" r="11"/><circle class="ink" fill="var(--card)" cx="-14" cy="158" r="11"/>`;
const LESSON = {
  meta: {
    kicker: 'Physique-Chimie · 3e année collège · Le concept en main',
    title: "L'énergie cinétique et la distance d'arrêt",
    titleAr: 'الطاقة الحركية ومسافة التوقف',
    short: 'Énergie cinétique',
    classes: ['3APIC-1', '3APIC-2', '3APIC-3'],
    footer: 'Prototype « Le concept en main » pour taalim.men, hors production. Textes et valeurs originaux. Non relu par un professeur de physique.'
  },

  misconceptions: {
    lineaire: { fr: "Tu as pensé que tout est proportionnel : doubler la vitesse double l'énergie. Mais la vitesse est au carré.", ar: 'اعتبرت أن كل شيء متناسب، لكن السرعة مرفوعة إلى المربع.' },
    constante: { fr: "Tu as pensé que l'énergie ou la distance ne dépend pas de la vitesse. Elle en dépend, et fortement.", ar: 'اعتبرت أن الطاقة أو المسافة لا تتعلق بالسرعة، وهي تتعلق بها بقوة.' },
    demi: { fr: 'Oubli du ½ dans Ec = ½·m·v².', ar: 'نسيت المعامل ½.' },
    carre: { fr: "La vitesse n'a pas été élevée au carré.", ar: 'لم ترفع السرعة إلى المربع.' },
    conversion: { fr: "La vitesse n'a pas été convertie de km/h en m/s (÷ 3,6).", ar: 'لم تحوّل السرعة إلى m/s.' },
    conv36: { fr: 'La conversion a été faite dans le mauvais sens : il faut diviser par 3,6, pas multiplier.', ar: 'التحويل في الاتجاه الخاطئ: نقسم على 3,6.' },
    unite: { fr: "Bonne démarche, mais l'unité ne correspond pas : vérifie J ou kJ.", ar: 'انتبه إلى الوحدة: J أو kJ.' },
    racine: { fr: 'Il manque la racine carrée : on trouve v² et non v.', ar: 'تنقص الجذر المربع.' },
    reaction: { fr: 'La distance de réaction a été oubliée : DA = DR + DF.', ar: 'نسيت مسافة رد الفعل.' }
  },

  hook: {
    title: 'Deux fois plus vite… deux fois plus loin ?',
    svg: `<svg class="fig" viewBox="0 0 640 220" role="img" aria-label="Deux voitures à 50 et 100 km/h devant un ballon">
      <line class="ink" x1="0" y1="40" x2="640" y2="40" style="stroke-width:1.6;opacity:.5"/><line class="ink" x1="0" y1="212" x2="640" y2="212" style="stroke-width:1.6;opacity:.5"/>
      <line class="ink" x1="0" y1="128" x2="640" y2="128" style="stroke-dasharray:14 12;stroke-width:1.6;opacity:.4"/>
      <g transform="translate(150 -45)">${CAR}</g><path class="ink" d="M54 75 h-20 M50 89 h-28" style="stroke-width:2"/>
      <g transform="translate(150 40)">${CAR}</g><path class="ink" d="M54 160 h-40 M50 174 h-56 M54 188 h-36" style="stroke-width:2;stroke:var(--heat)"/>
      <circle cx="560" cy="128" r="16" fill="var(--card)" class="ink"/>
      <text x="172" y="98" font-family="Kalam" font-weight="700" font-size="22" fill="var(--blue)">50 km/h</text>
      <text x="172" y="184" font-family="Kalam" font-weight="700" font-size="22" fill="var(--heat)">100 km/h</text></svg>`,
    text: "Un ballon roule sur la route. Deux voitures identiques freinent au même endroit : l'une roule à 50 km/h, l'autre à 100 km/h. La seconde va deux fois plus vite. A-t-elle besoin de deux fois plus de distance pour s'arrêter ?",
    ar: 'كرة تتدحرج على الطريق. سيارتان متماثلتان تكبحان في نفس المكان، الأولى بسرعة 50 km/h والثانية بسرعة 100 km/h. هل تحتاج الثانية إلى ضعف المسافة لتتوقف؟'
  },

  predict: [
    { q: 'La voiture passe de 50 km/h à 100 km/h. Son énergie cinétique est multipliée par :', ar: 'السرعة تتضاعف من 50 إلى 100 km/h. الطاقة الحركية تُضرب في:',
      options: [['× 2', 'lineaire'], ['× 4', ''], ['elle ne change pas', 'constante']] },
    { q: 'À 50 km/h, elle freine sur 14 m. À 100 km/h, sa distance de freinage devient environ :', ar: 'عند 50 km/h مسافة الكبح 14 m. عند 100 km/h تصبح تقريبا:',
      options: [['28 m', 'lineaire'], ['55 m', ''], ['14 m, la même', 'constante']] }
  ],

  experiment: {
    title: "Le banc d'essai",
    intro: 'Règle la voiture, puis appuie sur « Freiner ». Chaque essai s’ajoute au carnet.',
    html: `<svg class="fig" viewBox="0 0 800 240" role="img" aria-label="Voiture sur une route avec distance de réaction et de freinage">
      <defs><radialGradient id="g"><stop offset="0" stop-color="#f5a300" stop-opacity=".75"/><stop offset=".55" stop-color="#f5a300" stop-opacity=".25"/><stop offset="1" stop-color="#f5a300" stop-opacity="0"/></radialGradient></defs>
      <path class="ink" style="stroke-width:1.3;opacity:.4" d="M0 110 Q90 74 180 102 T380 94 Q480 70 560 100 T800 92"/>
      <line class="ink" x1="0" y1="171" x2="800" y2="171"/><line class="ink" x1="0" y1="212" x2="800" y2="212"/>
      <line class="ink" x1="0" y1="192" x2="800" y2="192" style="stroke-width:2;stroke-dasharray:16 14;opacity:.5"/>
      <rect id="wet" x="0" y="172" width="800" height="39" fill="var(--blue)" opacity="0"/>
      <rect id="mr" y="220" height="8" rx="4" fill="var(--blue)" width="0"/><rect id="mf" y="220" height="8" rx="4" fill="var(--heat)" width="0"/>
      <g id="sign" style="opacity:0"><line class="ink" id="pole" x1="0" y1="170" x2="0" y2="104"/><path id="tri" fill="var(--bg)" class="ink" d=""/><text id="ex" text-anchor="middle" font-family="Kalam" font-weight="700" font-size="26" fill="var(--heat)">!</text></g>
      <g id="car"><circle id="glow" cx="-36" cy="138" r="40" fill="url(#g)"/><g id="lines" class="ink" style="stroke-width:2"><path d="M-84 120 h-26 M-90 135 h-34 M-84 150 h-22"/></g>${CAR}<circle class="brk" cx="-62" cy="158" r="6" fill="var(--heat)" opacity="0"/><circle class="brk" cx="-14" cy="158" r="6" fill="var(--heat)" opacity="0"/></g></svg>
    <div class="readout">
      <div class="card"><small>Énergie cinétique</small><b id="ec" style="color:var(--glow)"></b></div>
      <div class="card"><small>Distance de réaction</small><b id="dr" style="color:var(--blue)"></b></div>
      <div class="card"><small>Distance de freinage</small><b id="df" style="color:var(--heat)"></b></div>
      <div class="card"><small>Distance d'arrêt</small><b id="da"></b></div></div>
    <div class="bars"><span>Énergie cinétique de la voiture</span><div class="bar"><i id="bk" style="background:var(--glow);width:100%"></i></div><span>Énergie thermique dans les freins</span><div class="bar"><i id="bh" style="background:var(--heat);width:0"></i></div></div>
    <div class="ctl" style="margin-top:10px">
      <div><label for="m">Masse <span id="mo"></span></label><input id="m" type="range" min="500" max="2000" step="100" value="1000"></div>
      <div><label for="v">Vitesse <span id="vo"></span></label><input id="v" type="range" min="10" max="130" step="10" value="50"></div>
      <div><label>Route</label><div class="seg" id="road"><button data-a="7" class="on">sèche</button><button data-a="5">mouillée</button></div></div>
      <div><label>Conducteur</label><div class="seg" id="drv"><button data-t="1" class="on">attentif · 1 s</button><button data-t="2">distrait · 2 s</button></div></div></div>
    <div class="row"><button class="b primary" id="go">Danger ! Freiner</button></div>
    <h3>Mon carnet d'essais</h3>
    <div class="scroll"><table><thead><tr><th>Essai</th><th>m (kg)</th><th>v (km/h)</th><th>Route</th><th>Ec (kJ)</th><th>DF (m)</th><th>DA (m)</th></tr></thead><tbody id="log"><tr><td colspan="7" class="note">Aucun essai pour l'instant.</td></tr></tbody></table></div>`,
    missions: [
      { id: 'v', text: 'Freiner à 50 km/h puis à 100 km/h, avec la même masse et la même route.' },
      { id: 'm', text: 'Freiner deux fois à la même vitesse, la seconde avec une masse double.' },
      { id: 'route', text: 'Comparer route sèche et route mouillée à la même vitesse.' }
    ],
    required: ['v'],
    note: 'Modèle : décélération constante de 7 m/s² sur route sèche et 5 m/s² sur route mouillée. Les valeurs réelles dépendent des pneus, des freins et du véhicule.',
    mount(root, api) {
      const $ = s => root.querySelector(s), $$ = s => [...root.querySelectorAll(s)], nf = api.nf;
      const ms = k => k / 3.6, EC = (m, k) => .5 * m * ms(k) ** 2, EMAX = EC(2000, 130), START = -14, RATE = 1.4;
      const X = d => 20 + (d + 25) * 4.75;
      let A = 7, TR = 1, busy = false; const runs = [];
      const cur = () => { const m = +$('#m').value, v = +$('#v').value, s = ms(v); return { m, v, s, a: A, tr: TR, e: EC(m, v), dr: s * TR, df: s * s / (2 * A) }; };
      const setCar = (d, vf, hf) => { $('#car').setAttribute('transform', `translate(${X(d).toFixed(1)} 0)`); $('#lines').style.opacity = vf; $$('.brk').forEach(b => b.setAttribute('opacity', hf.toFixed(2))); };
      const setGlow = e => $('#glow').setAttribute('r', (18 + 72 * Math.sqrt(e / EMAX)).toFixed(1));
      const marks = (r, a, b) => { const x0 = X(0), x1 = X(r.dr); $('#mr').setAttribute('x', x0); $('#mr').setAttribute('width', Math.max(0, X(a) - x0)); $('#mf').setAttribute('x', x1); $('#mf').setAttribute('width', Math.max(0, X(r.dr + b) - x1)); };
      const x = X(0); $('#pole').setAttribute('x1', x); $('#pole').setAttribute('x2', x); $('#tri').setAttribute('d', `M${x} 66 L${x + 24} 104 L${x - 24} 104 Z`); $('#ex').setAttribute('x', x); $('#ex').setAttribute('y', 100);
      const update = () => {
        const r = cur();
        $('#mo').textContent = '= ' + nf(r.m, 0) + ' kg'; $('#vo').textContent = `= ${r.v} km/h (${nf(r.s)} m/s)`;
        $('#ec').textContent = nf(r.e / 1000) + ' kJ'; $('#dr').textContent = nf(r.dr, 0) + ' m'; $('#df').textContent = nf(r.df, 0) + ' m'; $('#da').textContent = nf(r.dr + r.df, 0) + ' m';
        setCar(START, 1, 0); setGlow(r.e); marks(r, 0, 0); $('#sign').style.opacity = 0; $('#bk').style.width = '100%'; $('#bh').style.width = '0'; $('#wet').setAttribute('opacity', A === 5 ? .12 : 0);
      };
      const lock = b => { busy = b; $('#m').disabled = $('#v').disabled = $('#go').disabled = b; $$('#road button,#drv button').forEach(x => x.disabled = b); };
      const missions = () => {
        const has = f => runs.some((a, i) => runs.some((b, j) => i !== j && f(a, b)));
        if (has((a, b) => a.m === b.m && a.a === b.a && a.v === 50 && b.v === 100)) api.done('v');
        if (has((a, b) => a.v === b.v && a.a === b.a && b.m === 2 * a.m)) api.done('m');
        if (has((a, b) => a.v === b.v && a.a === 7 && b.a === 5)) api.done('route');
      };
      const logRun = r => {
        runs.push(r);
        $('#log').innerHTML = runs.slice(-8).map((x, i, arr) => `<tr><td>${runs.length - arr.length + i + 1}</td><td>${nf(x.m, 0)}</td><td>${x.v}</td><td>${x.a === 7 ? 'sèche' : 'mouillée'}</td><td>${nf(x.e / 1000)}</td><td>${nf(x.df, 0)}</td><td>${nf(x.dr + x.df, 0)}</td></tr>`).join('');
        missions();
      };
      const run = () => {
        if (busy) return; update(); lock(true);
        const r = cur(), s = r.s, tA = -START / s, tB = tA + r.tr, tC = tB + s / r.a; let t0 = null;
        const step = now => {
          if (t0 === null) t0 = now;
          let t = api.reduce ? tC : (now - t0) / 1000 * RATE; if (t > tC) t = tC;
          let d, vc; if (t < tB) { d = START + s * t; vc = s; } else { const tb = t - tB; vc = Math.max(0, s - r.a * tb); d = START + s * tB + s * tb - .5 * r.a * tb * tb; }
          const ef = (vc / s) ** 2;
          setCar(d, vc / s, t >= tB ? 1 - ef : 0); setGlow(r.e * ef); $('#sign').style.opacity = t >= tA ? 1 : 0;
          marks(r, Math.min(Math.max(d, 0), r.dr), Math.max(0, d - r.dr));
          $('#bk').style.width = ef * 100 + '%'; $('#bh').style.width = (1 - ef) * 100 + '%'; $('#ec').textContent = nf(r.e * ef / 1000) + ' kJ';
          if (t < tC) requestAnimationFrame(step); else { lock(false); logRun(r); }
        };
        requestAnimationFrame(step);
      };
      $('#m').oninput = $('#v').oninput = update; $('#go').onclick = run;
      $$('#road button').forEach(b => b.onclick = () => { A = +b.dataset.a; $$('#road button').forEach(x => x.classList.toggle('on', x === b)); update(); });
      $$('#drv button').forEach(b => b.onclick = () => { TR = +b.dataset.t; $$('#drv button').forEach(x => x.classList.toggle('on', x === b)); update(); });
      update();
    }
  },

  rule: {
    blocks: [
      { formula: 'E<sub>c</sub> = ½ · m · v²', text: 'Ec en joules (J), m en kilogrammes (kg), v en mètres par seconde (m/s). Pour convertir : v (m/s) = v (km/h) ÷ 3,6.', ar: 'الطاقة الحركية تساوي نصف جداء الكتلة في مربع السرعة. نحوّل السرعة إلى m/s بالقسمة على 3,6.' },
      { formula: 'D<sub>A</sub> = D<sub>R</sub> + D<sub>F</sub>', text: "La distance d'arrêt est la somme de la distance parcourue pendant le temps de réaction et de la distance de freinage.", ar: 'مسافة التوقف = مسافة رد الفعل + مسافة الكبح.' }
    ],
    seen: 'masse double, Ec double. Vitesse double, Ec quadruple, et la distance de freinage aussi. Route mouillée ou conducteur distrait : la distance d’arrêt s’allonge.'
  },

  proof: {
    title: 'Pourquoi « × 4 » ?',
    html: `<p class="hand" style="font-size:20px">½ · m · (2v)² = ½ · m · 4v² = 4 × E<sub>c</sub></p>
      <p>La vitesse est <b>au carré</b> dans la formule : doubler la vitesse multiplie l'énergie par 2 × 2 = 4.</p>
      <p>Pour s'arrêter, les freins transforment toute l'énergie cinétique en énergie thermique. Ils en absorbent à peu près la même quantité à chaque mètre. Quatre fois plus d'énergie demande donc environ quatre fois plus de mètres : 14 m à 50 km/h, environ 55 m à 100 km/h.</p>`,
    ar: 'السرعة مرفوعة إلى المربع، فمضاعفتها تضرب الطاقة الحركية في 4. الفرامل تحوّل هذه الطاقة إلى حرارة بقدر متقارب في كل متر، لذلك تتضاعف مسافة الكبح أربع مرات تقريبا.'
  },

  exercises: {
    levels: [
      { label: 'Niveau 1', make(R) { const m = R.int(500, 2000, 100), v = R.int(5, 30), E = .5 * m * v * v;
        return { q: `Une voiture de masse m = ${R.nf(m, 0)} kg roule à v = ${v} m/s. Calcule son énergie cinétique.`, unit: 'J', ans: E, digits: 0,
          traps: [[2 * E, 'demi'], [.5 * m * v, 'carre'], [E / 1000, 'unite']] }; } },
      { label: 'Niveau 2', make(R) { const m = R.int(600, 2000, 100), k = R.pick([36, 54, 72, 90, 108]), v = k / 3.6, E = .5 * m * v * v / 1000;
        return { q: `Une voiture de masse ${R.nf(m, 0)} kg roule à ${k} km/h. Calcule son énergie cinétique en kilojoules.`, unit: 'kJ', ans: E, digits: 2,
          traps: [[.5 * m * k * k / 1000, 'conversion'], [.5 * m * (k * 3.6) ** 2 / 1000, 'conv36'], [m * v * v / 1000, 'demi'], [E * 1000, 'unite'], [.5 * m * v / 1000, 'carre']] }; } },
      { label: 'Niveau 3', make(R) {
        if (Math.random() < .5) { const k = R.pick([36, 54, 72, 90]), v = k / 3.6, tr = R.pick([1, 1.5, 2]), df = Math.round(v * v / 14);
          return { q: `Un conducteur roule à ${k} km/h. Son temps de réaction est ${R.nf(tr)} s et la distance de freinage est ${df} m. Calcule la distance d'arrêt.`, unit: 'm', ans: v * tr + df, digits: 1,
            traps: [[df, 'reaction'], [k * tr + df, 'conversion']] }; }
        const m = R.int(5, 20) * 100, v = R.int(6, 30), E = .5 * m * v * v;
        return { q: `Un véhicule de masse ${R.nf(m, 0)} kg possède une énergie cinétique de ${R.nf(E, 0)} J. Calcule sa vitesse en m/s.`, unit: 'm/s', ans: v, digits: 1,
          traps: [[v * v, 'racine'], [Math.sqrt(E / m), 'demi']] }; } }
    ]
  },

  check: [
    { q: 'Un scooter passe de 20 km/h à 60 km/h : sa vitesse est multipliée par 3. Son énergie cinétique est multipliée par :', ar: 'سرعة دراجة نارية تُضرب في 3. الطاقة الحركية تُضرب في:',
      options: [['× 3', 'lineaire'], ['× 6', 'lineaire'], ['× 9', '']] },
    { q: "Sur route sèche, à 30 km/h, la distance de freinage est d'environ 5 m. À 60 km/h, elle est d'environ :", ar: 'عند 30 km/h مسافة الكبح حوالي 5 m. عند 60 km/h تصبح حوالي:',
      options: [['10 m', 'lineaire'], ['20 m', ''], ['5 m', 'constante']] }
  ]
};
/* LESSON:END */
</script>

<script>
/* ENGINE:BEGIN · Le concept en main · engine v1 · do not edit in a lesson; update it with tools/update_engine.py */
(() => {
const L = LESSON, $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const nf = (x, d = 1) => Number(x).toLocaleString('fr-FR', { maximumFractionDigits: d });
// Arabic text: keep each Latin or numeric expression left-to-right
const iso = t => String(t).replace(/[A-Za-z0-9][A-Za-z0-9'/²³·=+,.() ]*[A-Za-z0-9'²³)]/g, m => '⁦' + m + '⁩');
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const R = { int: (a, b, st = 1) => a + st * Math.floor(Math.random() * ((b - a) / st + 1)), pick: a => a[Math.floor(Math.random() * a.length)], nf };
const MIS = L.misconceptions || {};
const STEPS = (L.meta.steps || ['Question', 'Je prédis', 'Je teste', 'La règle', 'Pourquoi', 'Entraînement', 'Je vérifie']);
const S = { open: 1, pred: {}, check: {}, ex: {}, errs: {}, missions: new Set(), cur: null, lvl: 0 };
const near = (x, y) => Math.abs(x - y) <= Math.max(.02 * Math.abs(y), .05);

/* validation: shown to the author, caught by the flow test */
function validate() {
  const P = [], codeOk = c => c === '' || (MIS[c] && MIS[c].fr && MIS[c].ar);
  ['kicker', 'title', 'titleAr'].forEach(k => { if (!L.meta || !L.meta[k]) P.push(`meta.${k} manquant`); });
  for (const [set, name] of [[L.predict, 'predict'], [L.check, 'check']]) {
    if (!set || !set.length) P.push(`${name} vide`);
    (set || []).forEach((q, i) => {
      if (!q.q || !q.ar) P.push(`${name}[${i}] : texte ou arabe manquant`);
      const good = q.options.filter(o => o[1] === '').length; if (good !== 1) P.push(`${name}[${i}] : ${good} bonnes réponses au lieu d'une`);
      q.options.forEach(o => { if (!codeOk(o[1])) P.push(`${name}[${i}] : code « ${o[1]} » absent de misconceptions`); });
    });
  }
  const ex = L.experiment;
  if (!ex || !ex.missions || !ex.missions.length) P.push('experiment.missions vide');
  else (ex.required || [ex.missions[0].id]).forEach(id => { if (!ex.missions.some(m => m.id === id)) P.push(`mission requise « ${id} » inconnue`); });
  (L.exercises && L.exercises.levels || []).forEach((lv, l) => {
    for (let k = 0; k < 300; k++) {
      let e; try { e = lv.make(R); } catch (err) { P.push(`niveau ${l + 1} : ${err.message}`); break; }
      if (!e.q || !e.unit || !isFinite(e.ans)) { P.push(`niveau ${l + 1} : question, unité ou réponse invalide`); break; }
      for (const [v, c] of e.traps || []) {
        if (!codeOk(c) || !c) { P.push(`niveau ${l + 1} : code de piège « ${c} » inconnu`); return; }
        if (!isFinite(v)) { P.push(`niveau ${l + 1} : piège ${c} non fini`); return; }
        if (near(v, e.ans)) { P.push(`niveau ${l + 1} : le piège ${c} donne la bonne réponse pour « ${e.q} »`); return; }
      }
      const T = e.traps || [];
      for (let i = 0; i < T.length; i++) for (let j = i + 1; j < T.length; j++)
        if (T[i][1] !== T[j][1] && near(T[i][0], T[j][0])) { P.push(`niveau ${l + 1} : les pièges ${T[i][1]} et ${T[j][1]} donnent la même valeur pour « ${e.q} »`); return; }
    }
  });
  if (!L.exercises || !L.exercises.levels || !L.exercises.levels.length) P.push('exercises.levels vide');
  return P;
}

/* rendering */
function qBlock(arr, prefix) { return arr.map((q, i) => `<div class="q" id="${prefix}${i}"></div>`).join(''); }
function render() {
  const m = L.meta, h = L.hook, x = L.experiment, r = L.rule, p = L.proof;
  document.title = `${m.title} · Le concept en main`;
  $('#hd').innerHTML = `<div class="num">${m.kicker}</div><h1>${m.title}</h1><p class="ar">${iso(esc(m.titleAr))}</p>`;
  $('#ft').textContent = m.footer || '';
  $('#main').innerHTML = `
  <section class="moment" id="m1"><div class="num">1 · La question</div><h2>${h.title}</h2>${h.svg || ''}<p>${h.text}</p><p class="ar">${iso(esc(h.ar))}</p>
    <div class="row"><button class="b primary" data-next="2">Je fais ma prédiction</button></div></section>
  <section class="moment" id="m2" hidden><div class="num">2 · Je prédis</div><h2>Avant toute explication, choisis</h2>
    <p class="note">Il n'y a pas de piège : ta prédiction sert à voir ce que tu penses maintenant.</p>${qBlock(L.predict, 'p')}
    <div class="row"><button class="b primary" data-next="3" id="next2" disabled>Je teste</button></div></section>
  <section class="moment" id="m3" hidden><div class="num">3 · Je teste</div><h2>${x.title}</h2><p>${x.intro || ''}</p><div id="exp">${x.html}</div>
    <h3>Mes missions</h3><ul class="missions">${x.missions.map(mi => `<li data-m="${mi.id}">${mi.text}</li>`).join('')}</ul>
    ${x.note ? `<p class="note">${x.note}</p>` : ''}
    <div class="row"><button class="b primary" data-next="4" id="next3" disabled>J'ai observé, je nomme la règle</button><span class="note" id="next3n">Termine les missions marquées comme nécessaires.</span></div></section>
  <section class="moment" id="m4" hidden><div class="num">4 · Je nomme la règle</div><h2>La règle</h2>
    ${r.blocks.map(b => `<div class="rule"><div class="formula">${b.formula}</div><p>${b.text || ''}</p>${b.ar ? `<p class="ar">${iso(esc(b.ar))}</p>` : ''}</div>`).join('')}
    ${r.seen ? `<p><b>Ce que tu as vu :</b> ${r.seen}</p>` : ''}
    <div class="row"><button class="b primary" data-next="5">Je comprends pourquoi</button></div></section>
  <section class="moment" id="m5" hidden><div class="num">5 · Je comprends pourquoi</div><h2>${p.title}</h2>
    <div class="flapw"><div class="proof">${p.html}${p.ar ? `<p class="ar">${iso(esc(p.ar))}</p>` : ''}</div><button class="flap" id="flap">Soulever le rabat</button></div>
    <h3>Et ma prédiction ?</h3><div id="pv"></div>
    <div class="row"><button class="b primary" data-next="6">Je m'entraîne</button></div></section>
  <section class="moment" id="m6" hidden><div class="num">6 · Je m'entraîne</div><h2>Exercices sans fin</h2>
    <p class="ar">${iso('كل تمرين جديد بأعداد مختلفة.')}</p>
    <div class="seg" id="lv">${L.exercises.levels.map((lv, i) => `<button data-l="${i}" class="${i ? '' : 'on'}">${lv.label}</button>`).join('')}</div>
    <div class="ex"><p id="exq"></p><div class="row"><input id="exa" inputmode="decimal" autocomplete="off" aria-label="Ta réponse"><span id="exu" class="hand" style="font-size:20px"></span><button class="b" id="exc">Vérifier</button><button class="b" id="exn">Nouvel exercice</button></div><div class="fb" id="exf" aria-live="polite"></div></div>
    <p class="note" id="exs"></p>
    <div class="row"><button class="b primary" data-next="7">Je vérifie ce que j'ai compris</button></div></section>
  <section class="moment" id="m7" hidden><div class="num">7 · Je vérifie</div><h2>Pour finir</h2>${qBlock(L.check, 'c')}
    <div id="rep" hidden><h3>Mon bilan</h3><div class="report"><div class="card"><small>Prédictions justes</small><b id="r1"></b></div><div class="card"><small>Vérifications justes</small><b id="r2"></b></div><div class="card"><small>Exercices réussis</small><b id="r3"></b></div></div>
    <div id="r4"></div>
    <div class="row"><label for="cls" style="font-weight:400">Ma classe</label><select id="cls"><option value="">non indiquée</option>${(m.classes || []).map(c => `<option>${esc(c)}</option>`).join('')}</select><button class="b" id="copy">Copier le bilan</button><span class="note" id="cpn"></span></div>
    <p class="note">Le bilan ne contient aucun nom. Il reste sur cet appareil.</p></div></section>`;
}

/* steps */
function steps() {
  $('#steps').innerHTML = STEPS.map((n, i) => `<button data-s="${i + 1}" class="${i + 1 < S.open ? 'done' : ''} ${i + 1 === S.open ? 'cur' : ''}" ${i + 1 > S.open ? 'disabled' : ''}>${i + 1} · ${n}</button>`).join('');
  $$('#steps button').forEach(b => b.onclick = () => $('#m' + b.dataset.s).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }));
}
function openStep(n) {
  if (n > S.open) S.open = n;
  for (let i = 1; i <= S.open; i++) $('#m' + i).hidden = false;
  steps(); if (n === 5) verdicts(); if (n === 6 && !S.cur) newEx();
  $('#m' + n).scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

/* questions */
function question(q, el, store, key, onDone) {
  el.innerHTML = `<p><b>${q.q}</b></p><p class="ar">${iso(esc(q.ar))}</p><div class="opts">${q.options.map((o, i) => `<button data-i="${i}">${o[0]}</button>`).join('')}</div>`;
  el.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (store[key]) return; const i = +b.dataset.i, code = q.options[i][1];
    store[key] = { i, ok: code === '', code }; b.classList.add('pick'); el.querySelectorAll('button').forEach(x => x.disabled = x !== b); onDone();
  });
}
function verdicts() {
  $('#pv').innerHTML = L.predict.map((q, k) => {
    const a = S.pred[k]; if (!a) return ''; const right = q.options.find(o => o[1] === '')[0];
    return `<div class="verdict ${a.ok ? 'ok' : 'no'}"><b>${a.ok ? 'Prédiction juste' : 'Prédiction à corriger'} :</b> tu avais choisi « ${q.options[a.i][0]} », la réponse est « ${right} ».${a.ok ? '' : ' ' + MIS[a.code].fr + `<div class="ar">${iso(esc(MIS[a.code].ar))}</div>`}</div>`;
  }).join('');
}

/* experiment */
function done(id) {
  if (S.missions.has(id)) return; S.missions.add(id);
  const li = $(`.missions li[data-m="${id}"]`); if (li) li.classList.add('ok');
  const req = L.experiment.required || [L.experiment.missions[0].id], ok = req.every(r => S.missions.has(r));
  $('#next3').disabled = !ok;
  $('#next3n').textContent = !ok ? 'Termine les missions marquées comme nécessaires.' : S.missions.size === L.experiment.missions.length ? 'Toutes les missions sont faites.' : 'Tu peux continuer, ou finir les autres missions.';
}

/* exercises */
function newEx() {
  const lv = L.exercises.levels[S.lvl]; S.cur = lv.make(R);
  $('#exq').textContent = S.cur.q; $('#exu').textContent = S.cur.unit; $('#exa').value = ''; $('#exf').textContent = ''; $('#exf').className = 'fb'; $('#exc').disabled = false;
}
function checkEx() {
  const x = parseFloat($('#exa').value.replace(/[\s ]/g, '').replace(',', '.')), c = S.cur;
  if (!isFinite(x)) { $('#exf').textContent = 'Écris un nombre.'; $('#exf').className = 'fb no'; return; }
  const st = S.ex[S.lvl] || (S.ex[S.lvl] = [0, 0]); st[1]++;
  if (near(x, c.ans)) { st[0]++; $('#exf').textContent = `Juste : ${nf(c.ans, c.digits ?? 2)} ${c.unit}.`; $('#exf').className = 'fb ok'; $('#exc').disabled = true; }
  else {
    const t = (c.traps || []).find(tp => near(x, tp[0]));
    if (t) { S.errs[t[1]] = (S.errs[t[1]] || 0) + 1; $('#exf').innerHTML = MIS[t[1]].fr + `<div class="ar">${iso(esc(MIS[t[1]].ar))}</div>`; }
    else $('#exf').textContent = 'Pas encore. Reprends le calcul étape par étape.';
    $('#exf').className = 'fb no';
  }
  $('#exs').textContent = L.exercises.levels.map((lv, l) => { const s = S.ex[l] || [0, 0]; return `${lv.label} : ${s[0]} réussi${s[0] > 1 ? 's' : ''} sur ${s[1]}`; }).join(' · ');
}

/* report */
function report() {
  const p = L.predict.filter((q, k) => S.pred[k] && S.pred[k].ok).length, c = L.check.filter((q, k) => S.check[k].ok).length;
  const ok = Object.values(S.ex).reduce((s, v) => s + v[0], 0), tries = Object.values(S.ex).reduce((s, v) => s + v[1], 0);
  $('#r1').textContent = `${p} / ${L.predict.length}`; $('#r2').textContent = `${c} / ${L.check.length}`; $('#r3').textContent = `${ok} / ${tries}`;
  const codes = {}; [...Object.values(S.pred), ...Object.values(S.check)].forEach(a => { if (a.code) codes[a.code] = (codes[a.code] || 0) + 1; });
  Object.entries(S.errs).forEach(([k, n]) => codes[k] = (codes[k] || 0) + n);
  const list = Object.entries(codes).sort((a, b) => b[1] - a[1]);
  const pr = p / L.predict.length, cr = c / L.check.length;
  $('#r4').innerHTML = `<div class="verdict ${cr === 1 ? 'ok' : 'no'}">${cr > pr ? 'Tu as progressé depuis ta prédiction.' : cr === 1 ? "Tu avais déjà la bonne idée, et tu l'as confirmée." : 'Reviens au moment « Je teste » et refais les missions.'}</div>`
    + (list.length ? `<p><b>À retravailler :</b></p><ul>${list.map(([k, n]) => `<li>${MIS[k].fr} <span class="note">(${n} fois)</span></li>`).join('')}</ul>` : '<p>Aucune erreur type repérée.</p>');
  S.summary = { p, c, ex: `${ok}/${tries}`, errs: list };
  $('#rep').hidden = false; $('#rep').scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
}

/* start */
render(); steps();
$$('#main [data-next]').forEach(b => b.addEventListener('click', () => openStep(+b.dataset.next)));
L.predict.forEach((q, k) => question(q, $('#p' + k), S.pred, k, () => { $('#next2').disabled = L.predict.some((x, j) => !S.pred[j]); }));
L.check.forEach((q, k) => question(q, $('#c' + k), S.check, k, () => { if (L.check.every((x, j) => S.check[j])) report(); }));
$('#flap').onclick = () => $('#flap').classList.add('open');
$('#exc').onclick = checkEx; $('#exn').onclick = newEx;
$('#exa').addEventListener('keydown', e => { if (e.key === 'Enter') checkEx(); });
$$('#lv button').forEach(b => b.onclick = () => { S.lvl = +b.dataset.l; $$('#lv button').forEach(x => x.classList.toggle('on', x === b)); newEx(); });
$('#copy').onclick = async () => {
  const s = S.summary, t = `${L.meta.short || L.meta.title} · classe ${$('#cls').value || 'non indiquée'} · prédictions ${s.p}/${L.predict.length} · vérification ${s.c}/${L.check.length} · exercices ${s.ex} · erreurs ${s.errs.map(([k, n]) => k + '×' + n).join(', ') || 'aucune'}`;
  try { await navigator.clipboard.writeText(t); $('#cpn').textContent = 'Copié.'; } catch (e) { $('#cpn').textContent = t; }
};
L.experiment.mount($('#exp'), { done, nf, iso, reduce });
const problems = validate(), testMode = /[?&]test\b/.test(location.search);
if (problems.length) { console.error('Leçon invalide :\n' + problems.join('\n')); $('#main').insertAdjacentHTML('afterbegin', `<div id="problems"><b>À corriger avant publication :</b><ul>${problems.map(p => `<li>${esc(p)}</li>`).join('')}</ul></div>`); }
if (testMode) window.__fikra = { S, L, done, openStep, problems, newEx };
})();
/* ENGINE:END */
</script>
