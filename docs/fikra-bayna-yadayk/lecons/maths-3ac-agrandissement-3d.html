<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>التكبير والتصغير · Agrandissement et réduction</title>
<style>
  :root{--paper:#fbfaf6;--ink:#2a2a2e;--blue:#2f5bd3;--orange:#e8710a;--red:#d1153f}
  *{box-sizing:border-box;min-width:0}
  html,body{margin:0;height:100%;background:#5c4029;overflow:hidden;font-family:"Noto Naskh Arabic","Geeza Pro",Arial,sans-serif;color:var(--ink)}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .top{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;flex-direction:column;gap:6px;pointer-events:none}
  .row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding-bottom:2px}

  .chip,.btn{flex:none;font:700 15px "Noto Naskh Arabic","Geeza Pro",Arial,sans-serif;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:6px 12px;min-height:40px;box-shadow:2px 2px 0 rgba(0,0,0,.3);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--ink);color:var(--paper)}
  .chip.voice.on{background:var(--blue);border-color:var(--blue)}
  .sub .chip{font-size:14px;min-height:36px;padding:4px 10px;border-width:1.5px}
  .btn.acc{background:var(--red);border-color:var(--red);color:#fff}
  .btn.big{font:700 20px "Comic Sans MS","Chalkboard SE",cursive;min-width:58px}
  .chip:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .hud{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(10px + env(safe-area-inset-bottom));pointer-events:none;display:flex;flex-direction:column;gap:7px;align-items:center}

  .cards{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
  .card{background:var(--paper);border:1.5px solid #3a3a40;border-radius:4px;padding:4px 9px 3px;box-shadow:2px 3px 0 rgba(0,0,0,.25);min-width:80px;text-align:center;transform:rotate(var(--r,0deg))}
  .card[hidden]{display:none}
  .card small{display:block;font-size:13px;color:#555;unicode-bidi:plaintext}
  .card b{font:700 20px/1.15 "Comic Sans MS","Chalkboard SE","Marker Felt",cursive;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
  .card b i{font-style:normal;font-size:14px;color:#555;margin-left:3px}
  #notice{background:rgba(251,250,246,.95);border-radius:8px;padding:6px 14px;font-size:15px;max-width:660px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.2);min-height:3.2em;display:flex;align-items:center;justify-content:center}
  #notice b{color:var(--red)}
  #err{position:fixed;top:110px;left:12px;right:12px;background:#fff;border:2px solid var(--red);padding:10px;display:none;font-size:14px;direction:ltr;z-index:9}

    .hud{padding-left:calc(170px + env(safe-area-inset-left));gap:5px}
    #notice{font-size:13px;min-height:2.6em;padding:4px 12px}
    .chip,.btn{min-height:36px;padding:4px 10px;font-size:14px}

<body>
<canvas id="c" aria-label="Agrandissement et réduction en 3D"></canvas>
<div class="top">

  <div class="row sub" id="subs"></div>
</div>
<div class="hud">
  <div class="acts" id="acts"></div>

    <div class="card" id="k0" style="--r:-2deg"><small></small><b></b></div>
    <div class="card" id="k1" style="--r:1.5deg"><small></small><b></b></div>
    <div class="card" id="k2" style="--r:-1deg"><small></small><b></b></div>

  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

window.addEventListener('error', e => { const el = document.getElementById('err'); el.style.display = 'block'; el.textContent = 'Error: ' + e.message; });

/* =========================================================
   Agrandissement et réduction · 3e année collège (3AC).
   Units: 1 world unit = 1 cm. Page plane: x to the right, z toward the reader, y up.
   Every volume, area and length is computed from k each frame.
   ========================================================= */
const PAGE_Y = 1.2, YL = PAGE_Y + 0.035;
const C = new THREE.Vector2(10.5, -3);                 // centre of the experiment on the right page
const PYR = { a: 8, H: 10 };                            // square pyramid: base side, height (cm)
const GLASS = { R: 5, H: 8, stem: 3 };                  // conical glass: rim radius, cone height, stem
const TRACK = { x0: 3.5, x1: 13.5, z: 9 };
const VOICE = { q: { audio: 'audio/maths-3ac-agrandissement-question.mp3' }, r: { audio: 'audio/maths-3ac-agrandissement-regle.mp3' } };

/* ---------- pure maths, also checked by a Node script ---------- */
const M = {
  pyrVolume: (a, H) => a * a * H / 3,
  coneVolume: (R, H) => Math.PI * R * R * H / 3,
  // apex-down container filled to a volume fraction f: the water is a reduction of ratio ∛f
  levelRatio: f => Math.cbrt(Math.max(0, Math.min(1, f))),
  pours: k => 1 / (k * k * k),

/* ---------- State ---------- */
const S = { lang: 'ar', mode: 'verre', drag: null, handles: [], lastAction: 'idle', actionTime: 0 };
function initState() {
  S.verre = { k: 0.5, choice: null };
  S.coupe = { k: 0.5, sep: false, t: 0 };

  S.cubes = { k: 2, t0: 0 };
}
initState();
const isoLatin = t => t.replace(/[\[(A-Za-z0-9][A-Za-z0-9'()\[\]=·×÷⁄½⅓⅛¼²³∛%,. ]*[A-Za-z0-9')\]²³%]/g, m => '⁦' + m + '⁩');
const tr = (ar, fr) => S.lang === 'ar' ? isoLatin(ar) : fr;
const V = (x, z) => new THREE.Vector2(x, z);
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const fmt = (x, d = 1) => (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',');
const act = n => { S.lastAction = n; S.actionTime = performance.now(); };
const recent = (n, ms = 2500) => S.lastAction === n && performance.now() - S.actionTime < ms;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ---------- Renderer ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x5c4029);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 600);
scene.add(new THREE.HemisphereLight(0xfffaf0, 0x6b4a2f, 1.1));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.6);
sun.position.set(-30, 60, 25); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -35, right: 35, top: 30, bottom: -30, near: 10, far: 150 }); sun.shadow.bias = -0.0008;
scene.add(sun);

/* ---------- Canvas textures ---------- */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }

function woodTexture() {
  const [c, g] = makeCanvas(1024, 1024); g.fillStyle = '#8a5f3c'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 260; i++) { const y = Math.random() * 1024, a = 0.05 + Math.random() * 0.12;
    g.strokeStyle = Math.random() < .5 ? `rgba(60,35,18,${a})` : `rgba(190,140,95,${a})`; g.lineWidth = 1 + Math.random() * 3;
    g.beginPath(); g.moveTo(0, y); for (let x = 0; x <= 1024; x += 32) g.lineTo(x, y + Math.sin(x / 90 + i) * 6 + Math.sin(x / 23 + i * 3) * 1.5); g.stroke(); }

}

  g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(120,110,90,${Math.random() * .05})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
  g.strokeStyle = 'rgba(80,80,90,.10)'; g.lineWidth = 1.2;
  for (let i = -h; i < h; i += 7) { const x0 = spineRight ? w - 60 : 0; g.beginPath(); g.moveTo(x0, i); g.lineTo(x0 + 60, i + 60); g.stroke(); }
}
function leftPageTexture() {
  const W = 1000, H = 1300, [c, g] = makeCanvas(W, H); paperBase(g, W, H, true);
  const ar = S.lang === 'ar', X = ar ? W - 90 : 90, setDir = () => { g.direction = ar ? 'rtl' : 'ltr'; g.textAlign = ar ? 'right' : 'left'; };
  setDir(); g.fillStyle = '#26262b';
  g.font = `700 ${ar ? 80 : 68}px ${AR_FONT}`; g.fillText(tr('التكبير والتصغير', 'Agrandir, réduire'), X, 190);
  g.strokeStyle = '#d1153f'; g.lineWidth = 4; g.beginPath(); g.moveTo(X, 222); g.lineTo(ar ? X - 430 : X + 430, 226); g.stroke();
  g.font = `700 ${ar ? 44 : 38}px ${AR_FONT}`;
  g.fillText(tr('نضرب كل الأطوال في نفس العدد k', 'On multiplie toutes les longueurs par k'), X, 330);
  g.fillText(tr('مقطع هرم بمستوى مواز للقاعدة: k = SA\' ÷ SA', 'Section parallèle à la base : k = SA\' ÷ SA'), X, 405);
  g.direction = 'ltr'; g.textAlign = 'center'; g.font = `700 64px ${HAND}`;
  [['#e8710a', tr('الأطوال', 'longueurs'), '× k'], ['#2f5bd3', tr('المساحات', 'aires'), '× k²'], ['#d1153f', tr('الحجوم', 'volumes'), '× k³']].forEach(([col, w, f], i) => {
    const y = 560 + i * 110; g.fillStyle = col; g.fillText(f, ar ? 300 : 700, y); setDir(); g.font = `700 ${ar ? 50 : 44}px ${AR_FONT}`; g.fillStyle = '#26262b'; g.fillText(w, X, y); g.direction = 'ltr'; g.textAlign = 'center'; g.font = `700 64px ${HAND}`; });
  setDir(); g.fillStyle = '#26262b'; g.font = `${ar ? 42 : 36}px ${AR_FONT}`;
  const lines = ar ? ['k > 1 تكبير، و 0 < k < 1 تصغير.', 'الأشكال تحافظ على زواياها.', 'نصف الارتفاع يعني ثُمن الحجم فقط.'] : ['k > 1 : agrandissement ; 0 < k < 1 : réduction.', 'Les angles ne changent pas.', 'Moitié de la hauteur : un huitième du volume.'];
  lines.forEach((l, i) => g.fillText(ar ? isoLatin(l) : l, X, 940 + i * 82));
  g.font = `${ar ? 32 : 28}px ${AR_FONT}`; g.fillStyle = '#6a6a72';
  g.fillText(tr('حرّك المؤشر أو استعمل الزرين − و +. اسحب الفراغ لتدوير الكتاب.', 'Déplace le curseur ou utilise − et +. Glisse dans le vide pour tourner.'), X, 1200);
  return tex(c);
}
const PX = 48;
function rightPageTexture() {
  const W = 20 * PX, H = 26 * PX, [c, g] = makeCanvas(W, H); paperBase(g, W, H, false);
  const X = x => (x - 0.5) * PX, Z = z => (z + 13) * PX;
  g.strokeStyle = 'rgba(70,90,130,.14)'; g.lineWidth = 1;
  for (let x = 2; x <= 19; x++) { g.beginPath(); g.moveTo(X(x), Z(-11.5)); g.lineTo(X(x), Z(5.5)); g.stroke(); }
  for (let z = -11.5; z <= 5.5; z++) { g.beginPath(); g.moveTo(X(2), Z(z)); g.lineTo(X(19), Z(z)); g.stroke(); }
  return tex(c);
}

/* ---------- Desk and book ---------- */
const pencil = new THREE.LineBasicMaterial({ color: 0x4a4a52 });
function withEdges(mesh, thr = 20) { mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, thr), pencil)); return mesh; }
const desk = new THREE.Mesh(new THREE.PlaneGeometry(260, 200), new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: .75 }));
desk.rotation.x = -Math.PI / 2; desk.receiveShadow = true; scene.add(desk);
const cover = new THREE.Mesh(new THREE.BoxGeometry(43, 0.35, 28.4), new THREE.MeshStandardMaterial({ color: 0x7b2d26, roughness: .8 }));
cover.position.set(0, 0.175, 0); cover.castShadow = cover.receiveShadow = true; scene.add(cover);
const edgeMat = new THREE.MeshStandardMaterial({ color: 0xf1ede2, roughness: .95 });
const rightTop = new THREE.MeshStandardMaterial({ map: rightPageTexture(), roughness: .95 });
const leftTop = new THREE.MeshStandardMaterial({ map: leftPageTexture(), roughness: .95 });
const rightPage = withEdges(new THREE.Mesh(new THREE.BoxGeometry(20, PAGE_Y - 0.35, 26), [edgeMat, edgeMat, rightTop, edgeMat, edgeMat, edgeMat]));
rightPage.position.set(10.5, 0.35 + (PAGE_Y - 0.35) / 2, 0); rightPage.receiveShadow = rightPage.castShadow = true; scene.add(rightPage);
const leftPage = withEdges(new THREE.Mesh(new THREE.BoxGeometry(20, PAGE_Y - 0.35, 26), [edgeMat, edgeMat, leftTop, edgeMat, edgeMat, edgeMat]));
leftPage.position.set(-10.5, 0.35 + (PAGE_Y - 0.35) / 2 + 0.25, 0); leftPage.rotation.z = 0.025; leftPage.receiveShadow = leftPage.castShadow = true; scene.add(leftPage);
function refreshPages() { leftTop.map.dispose(); leftTop.map = leftPageTexture(); leftTop.needsUpdate = true; panelKey = ''; }

/* the slider's label and ticks live on their own panel, hidden with the slider */
function makePanel(x0, x1, z0, z1) {
  const [c, g] = makeCanvas(Math.round((x1 - x0) * PX), Math.round((z1 - z0) * PX)), t = tex(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0), new THREE.MeshBasicMaterial({ map: t, transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, PAGE_Y + 0.003, (z0 + z1) / 2); m.renderOrder = 1; scene.add(m);
  return { m, g, t, X: x => (x - x0) * PX, Z: z => (z - z0) * PX, W: c.width, H: c.height };
}
const sliderPanel = makePanel(TRACK.x0 - 1.5, TRACK.x1 + 1.5, TRACK.z - 2.2, TRACK.z + 2.2);
let panelKey = '';
function drawPanel(title, k0, k1) {
  const key = S.lang + title + k0 + k1; if (key === panelKey) return; panelKey = key;
  const P = sliderPanel, g = P.g; g.clearRect(0, 0, P.W, P.H);
  g.fillStyle = '#26262b'; g.direction = S.lang === 'ar' ? 'rtl' : 'ltr'; g.textAlign = 'center'; g.font = `700 32px ${AR_FONT}`;
  g.fillText(title, P.X((TRACK.x0 + TRACK.x1) / 2), P.Z(TRACK.z - 1.3));
  g.direction = 'ltr'; g.font = `26px ${HAND}`; g.fillStyle = '#555';
  g.fillText(fmt(k0, 1), P.X(TRACK.x0), P.Z(TRACK.z + 1.6)); g.fillText(fmt(k1, 1), P.X(TRACK.x1), P.Z(TRACK.z + 1.6));
  g.strokeStyle = '#444'; g.lineWidth = 2;
  for (let i = 0; i <= 10; i++) { const x = P.X(TRACK.x0 + (TRACK.x1 - TRACK.x0) * i / 10); g.beginPath(); g.moveTo(x, P.Z(TRACK.z + .55)); g.lineTo(x, P.Z(TRACK.z + (i % 5 ? .8 : 1))); g.stroke(); }
  P.t.needsUpdate = true;
}

/* ---------- Immediate-mode pools ---------- */
function makeSegEntry(max) {
  const geo = new THREE.BufferGeometry(), attr = new THREE.BufferAttribute(new Float32Array(max * 18), 3);
  geo.setAttribute('position', attr);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0, transparent: true, side: THREE.DoubleSide, depthWrite: false }));
  mesh.frustumCulled = false; mesh.renderOrder = 2; mesh.visible = false; scene.add(mesh);
  return { mesh, geo, attr, max };
}
const segPool = Array.from({ length: 20 }, () => makeSegEntry(64)); let segUsed = 0;
// flat ribbons at height y: segs = [[x1,z1,x2,z2], ...]
function drawSegs(segs, color, w = 0.12, y = YL, opacity = 1) {
  const e = segPool[segUsed++]; if (!e) return;
  const A = e.attr.array, n = Math.min(segs.length, e.max); let k = 0;
  for (let i = 0; i < n; i++) {
    const [x1, z1, x2, z2] = segs[i], dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz); if (L < 1e-6) continue;
    const nx = -dz / L * w / 2, nz = dx / L * w / 2, q = [x1 + nx, z1 + nz, x1 - nx, z1 - nz, x2 - nx, z2 - nz, x2 + nx, z2 + nz];

}
const squareSegs = (c, s) => { const h = s / 2, p = [[c.x - h, c.y - h], [c.x + h, c.y - h], [c.x + h, c.y + h], [c.x - h, c.y + h]]; return p.map((a, i) => [a[0], a[1], p[(i + 1) % 4][0], p[(i + 1) % 4][1]]); };

const labPool = Array.from({ length: 14 }, () => {
  const [c, g] = makeCanvas(192, 96), t = tex(c);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false }));
  s.renderOrder = 10; s.visible = false; s.userData = { g, t, key: '' }; scene.add(s); return s;
});
let labUsed = 0;
function drawLabel(text, color, x, y, z, size = 1.3) {
  const s = labPool[labUsed++]; if (!s) return; const key = text + color;
  if (s.userData.key !== key) { const g = s.userData.g; g.clearRect(0, 0, 192, 96); g.font = `700 ${text.length > 4 ? 44 : 60}px ${HAND}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineWidth = 8; g.strokeStyle = 'rgba(251,250,246,.95)'; g.strokeText(text, 96, 50); g.fillStyle = color; g.fillText(text, 96, 50); s.userData.t.needsUpdate = true; s.userData.key = key; }

// prisms between two polygons (same vertex count, up to 48): pyramids, frustums, cones, discs
function makePrism(material, edgeColor) {

function setPrism(pr, bot, top) {

  for (let i = 0; i < n; i++) { const j = (i + 1) % n; put(bot[i]); put(bot[j]); put(top[j]); put(bot[i]); put(top[j]); put(top[i]); }

}
const sq = (c, y, s, off = V3(0, 0, 0)) => { const h = s / 2; return [[-h, -h], [h, -h], [h, h], [-h, h]].map(([dx, dz]) => V3(c.x + dx + off.x, y + off.y, c.y + dz + off.z)); };
const circ = (c, y, r, n = 48) => Array.from({ length: n }, (_, i) => V3(c.x + r * Math.cos(2 * Math.PI * i / n), y, c.y + r * Math.sin(2 * Math.PI * i / n)));
const rep = (p, n) => Array.from({ length: n }, () => p.clone());

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .85, side: THREE.DoubleSide, ...o });
const glassMat = o => mat(0xe9eef6, { transparent: true, opacity: .32, roughness: .25, depthWrite: false, ...o });
const prPaper = makePrism(mat(0xfdfcf7), 0x303036);                                         // frustum, cut-out paper
const prSmall = makePrism(mat(0x2f5bd3, { transparent: true, opacity: .78, roughness: .55 }), 0x1d3d99); // the reduction

/* ---------- Camera ---------- */
const home = { pos: new THREE.Vector3(), target: new THREE.Vector3(), dist: 60 };
const view = { W: 1, H: 1, Fw: 1, Fh: 1, freeW: 1, freeH: 1 };
function measureFree() {
  const W = innerWidth, H = innerHeight;
  const cardsEl = document.querySelector('.cards'), column = getComputedStyle(cardsEl).position === 'fixed';
  const topB = document.querySelector('.top').getBoundingClientRect().bottom;
  cardsEl.style.top = column ? (topB + 8) + 'px' : '';
  let hudTop = H;
  for (const el of [document.getElementById('acts'), document.getElementById('notice'), column ? null : cardsEl]) {
    if (!el) continue; const r = el.getBoundingClientRect(); if (r.height > 0) hudTop = Math.min(hudTop, r.top);
  }
  const left = column ? cardsEl.getBoundingClientRect().right + 8 : 0;
  const top = topB + 6, bottom = Math.max(top + 80, hudTop - 6);
  return { W, H, left, right: W, top, bottom };
}
function computeHome() {
  const f = measureFree(), W = f.W, H = f.H, cx = (f.left + f.right) / 2, cy = (f.top + f.bottom) / 2;
  const Fw = 2 * Math.max(cx, W - cx), Fh = 2 * Math.max(cy, H - cy);
  Object.assign(view, { W, H, Fw, Fh, freeW: f.right - f.left, freeH: f.bottom - f.top });
  camera.aspect = Fw / Fh; camera.setViewOffset(Fw, Fh, Fw / 2 - cx, Fh / 2 - cy, W, H);
  const portrait = view.freeW / view.freeH < 0.9, fitW = portrait ? 24 : 46, fitH = portrait ? 30 : 32;
  const tv = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  home.dist = Math.max(fitW * Fh / (2 * view.freeW * tv), fitH * Fh / (2 * view.freeH * tv)) * 1.04;
  home.target.set(portrait ? 9.5 : 0, 3, 0.5);
  home.pos.copy(home.target).add(new THREE.Vector3(0.08, 0.62, 0.78).normalize().multiplyScalar(home.dist));
}
let orbit = null, intro = null;
function resize(rehome = true) {
  renderer.setSize(innerWidth, innerHeight, false); computeHome();
  if (orbit) { orbit.minDistance = home.dist * .5; orbit.maxDistance = home.dist * 1.35;
    if (rehome && !intro) { camera.position.copy(home.pos); orbit.target.copy(home.target); orbit.update(); } }
}

/* ---------- Pointer: the slider knob (registered before OrbitControls) ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), sliderPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -PAGE_Y);
function setRay(e) { const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); }
function pageHit() { const p = new THREE.Vector3(); return ray.ray.intersectPlane(sliderPlane, p) ? V(p.x, p.z) : null; }
canvas.addEventListener('pointerdown', e => {
  setRay(e); const sl = slider(); if (!sl) return;
  const r = canvas.getBoundingClientRect(), v = knob.position.clone().project(camera);
  const near = Math.hypot((v.x + 1) / 2 * r.width - (e.clientX - r.left), (1 - v.y) / 2 * r.height - (e.clientY - r.top)) < 40;
  if (!near && !ray.intersectObjects([knobHit], false).length) return;

canvas.addEventListener('pointermove', e => {
  if (!S.drag) return; setRay(e); const p = pageHit(), sl = slider(); if (!p || !sl) return;
  const t = THREE.MathUtils.clamp((p.x - TRACK.x0) / (TRACK.x1 - TRACK.x0), 0, 1);
  sl.set(Math.round((sl.min + t * (sl.max - sl.min)) / sl.step) * sl.step);
});
function endDrag(e) { if (S.drag) { S.drag = null; if (!intro) orbit.enabled = true; try { canvas.releasePointerCapture(e.pointerId); } catch (_) {} } }
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
orbit = new OrbitControls(camera, canvas);
Object.assign(orbit, { enablePan: false, enableDamping: true, dampingFactor: .08, minPolarAngle: .15, maxPolarAngle: 1.3, minAzimuthAngle: -.85, maxAzimuthAngle: .85, rotateSpeed: .6 });
function startIntro() { computeHome(); const from = home.target.clone().add(new THREE.Vector3(-.35, 1.2, 1.1).normalize().multiplyScalar(home.dist * 1.9));
  intro = { t0: performance.now(), dur: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 3000, from }; orbit.enabled = false; orbit.target.copy(home.target); camera.position.copy(from); camera.lookAt(home.target); }

/* ---------- HUD ---------- */
const cards = [0, 1, 2, 3].map(i => { const el = document.getElementById('k' + i); return { el, s: el.querySelector('small'), b: el.querySelector('b'), key: '' }; });
function card(i, label, val) { const c = cards[i], key = label + '|' + val; if (c.key === key) return; c.key = key; if (val === null) { c.el.hidden = true; return; } c.el.hidden = false; c.s.textContent = label; c.b.innerHTML = val; }

const esc = s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Darija voice: one clip for the question (le verre), one for the rule (other modes) */
let player = null;

}

const MODE_LIST = [['verre', 'الكأس', 'Le verre'], ['coupe', 'المقطع', 'La section'], ['verser', 'الملء', 'Remplir'], ['cubes', 'التكبير', 'Agrandir']];
const SUBS = {
  verser: [['0.5', 'k = ½', 'k = ½'], ['0.3333333333333333', 'k = ⅓', 'k = ⅓']],
  cubes: [['1', 'k = 1', 'k = 1'], ['2', 'k = 2', 'k = 2'], ['3', 'k = 3', 'k = 3'], ['4', 'k = 4', 'k = 4']],

  modes.innerHTML = MODE_LIST.map(([k, a, f]) => `<button class="chip${S.mode === k ? ' on' : ''}" data-m="${k}">${esc(tr(a, f))}</button>`).join('')

  document.getElementById('reset').onclick = () => { const m = S.mode; initState(); S.mode = m; MODES[m].enter && MODES[m].enter(); buildHUD(); startIntro(); };
  const subs = document.getElementById('subs'), list = SUBS[S.mode];

  const acts = document.getElementById('acts');

  acts.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { MODES[S.mode].action(b.dataset.a); buildHUD(); });

function setMode(m) { S.mode = m; if (player) player.pause(); act('mode'); MODES[m].enter && MODES[m].enter(); buildHUD(); }
// the slider of the current mode, or null
function slider() { const m = MODES[S.mode]; return m.slider ? m.slider() : null; }
const stepper = (sl, d) => sl.set(Math.round((sl.get() + d * sl.step) / sl.step) * sl.step);

/* =========================================================
   Modes
   ========================================================= */
const ORANGE = '#e8710a', BLUE = '#2f5bd3', RED = '#d1153f', INK = '#26262b';
const pct = x => fmt(100 * x, 1) + unit('%');

const MODES = {
  /* 1 · predict: a conical glass filled to half its height */
  verre: {
    enter() { if (!S.verre.choice) S.verre.k = 0.5; },
    slider: () => S.verre.choice ? { min: 0, max: 1, step: 0.05, get: () => S.verre.k, set: v => { S.verre.k = THREE.MathUtils.clamp(v, 0, 1); S.verre.moved = true; act('k'); } } : null,
    actions() {
      if (!S.verre.choice) return [['half', '½', 'big'], ['quarter', '¼', 'big'], ['eighth', '⅛', 'big']];
      return [['minus', '−', 'big'], ['plus', '+', 'big'], ['again', tr('سؤال من جديد', 'Reposer la question')]];
    },
    action(id) {
      if (id === 'minus' || id === 'plus') { stepper(this.slider(), id === 'plus' ? 1 : -1); return; }
      if (id === 'again') { S.verre.choice = null; S.verre.k = 0.5; S.verre.moved = false; act('again'); return; }
      S.verre.choice = id; S.verre.moved = false; act('choice');
    },
    draw() {
      const k = S.verre.k, y0 = PAGE_Y + GLASS.stem, apex = V3(C.x, y0, C.y);
      setPrism(prFoot, circ(C, PAGE_Y + 0.01, 2.6), circ(C, PAGE_Y + 0.25, 2.6));
      stem.visible = true;
      setPrism(prGlass, rep(apex, 48), circ(C, y0 + GLASS.H, GLASS.R));
      if (k > 0.001) setPrism(prWater, rep(apex, 48), circ(C, y0 + k * GLASS.H, k * GLASS.R));
      // heights drawn on the side
      const xs = C.x + GLASS.R + 1.2;
      drawSegs([[xs - .3, C.y, xs + .3, C.y]], INK, .08, y0); drawSegs([[xs - .3, C.y, xs + .3, C.y]], INK, .08, y0 + GLASS.H);
      drawSegs([[xs - .5, C.y, xs + .5, C.y]], BLUE, .14, y0 + k * GLASS.H);
      drawLabel('H', INK, xs + 1.2, y0 + GLASS.H, C.y); drawLabel('h', BLUE, xs + 1.2, y0 + k * GLASS.H, C.y);
      const fr = k * k * k;
      card(0, tr('الارتفاع h ÷ H', 'Hauteur h ÷ H'), fmt(k, 2));
      card(1, tr('سطح الماء', "Surface de l'eau"), S.verre.choice ? pct(k * k) : '?');
      card(2, tr('حجم الماء', "Volume d'eau"), S.verre.choice ? pct(fr) : '?');
      card(3, tr('من الكأس', 'du verre'), S.verre.choice ? fmt(M.coneVolume(k * GLASS.R, k * GLASS.H), 1) + unit('cm³') : '?');
      if (!S.verre.choice) { notice(tr('ملأنا الكأس المخروطية إلى نصف ارتفاعها. أي جزء من حجم الكأس فيها؟ اختر قبل أن تجرب.', "On a rempli le verre conique jusqu'à la moitié de sa hauteur. Quelle part du volume du verre contient-il ? Choisis avant de tester.")); return; }
      const c = S.verre.choice;
      if (!S.verre.moved) {
        if (c === 'eighth') notice(tr('صحيح. الماء مخروط صغير، تصغير للكأس بنسبة ½، فحجمه ½ × ½ × ½ = ⅛ من حجم الكأس.', "Exact. L'eau forme un petit cône, réduction du verre de rapport ½ : son volume est ½ × ½ × ½ = ⅛ du verre."));
        else if (c === 'half') notice(tr('ليس نصفا. الحجم لا يتبع الارتفاع وحده، لأن الماء يضيق أيضا. انظر البطاقات: ⅛ فقط.', "Pas la moitié. Le volume ne suit pas la hauteur seule : l'eau est aussi moins large. Regarde les étiquettes : ⅛ seulement."));
        else notice(tr('¼ = ½ × ½ هي نسبة مساحة سطح الماء، لا نسبة الحجم. الحجم فيه بُعد ثالث: ⅛.', "¼ = ½ × ½ est le rapport des aires (la surface de l'eau), pas des volumes. Le volume a une troisième dimension : ⅛."));
        return;
      }
      if (k < 0.01) notice(tr('الكأس فارغة.', 'Le verre est vide.'));
      else if (Math.abs(fr - .5) < .03) notice(tr(`نصف الحجم يحتاج ارتفاعا قدره ${fmt(k * 100, 0)}% من الكأس، لأن ∛0,5 ≈ 0,79.`, `Pour la moitié du volume, il faut monter à ${fmt(k * 100, 0)} % de la hauteur, car ∛0,5 ≈ 0,79.`));
      else if (k > .99) notice(tr('الكأس ممتلئة: k = 1.', 'Le verre est plein : k = 1.'));
      else notice(tr(`h = ${fmt(k, 2)} × H، والمساحة × ${fmt(k * k, 2)}، والحجم × ${fmt(fr, 3)}. حرّك المؤشر لتجد نصف الحجم.`, `h = ${fmt(k, 2)} × H : aire × ${fmt(k * k, 2)}, volume × ${fmt(fr, 3)}. Cherche la hauteur qui donne la moitié du volume.`));
    }
  },

  /* 2 · section of a square pyramid by a plane parallel to its base */
  coupe: {
    slider: () => ({ min: 0.1, max: 0.9, step: 0.05, get: () => S.coupe.k, set: v => { S.coupe.k = THREE.MathUtils.clamp(v, .1, .9); act('k'); } }),
    actions: () => [['minus', '−', 'big'], ['plus', '+', 'big'], ['sep', S.coupe.sep ? tr('أرجع الهرم الصغير', 'Remettre la petite pyramide') : tr('افصل الهرم الصغير', 'Séparer la petite pyramide'), 'acc']],
    action(id) { if (id === 'sep') { S.coupe.sep = !S.coupe.sep; act('sep'); } else stepper(this.slider(), id === 'plus' ? 1 : -1); },
    draw(now, dt) {
      const { a, H } = PYR, k = S.coupe.k, c = S.coupe;
      c.t += Math.sign((c.sep ? 1 : 0) - c.t) * Math.min(Math.abs((c.sep ? 1 : 0) - c.t), dt / 1.2);
      const e = ease(c.t), ys = PAGE_Y + (1 - k) * H, apex = V3(C.x, PAGE_Y + H, C.y);

      drawLabel('A', INK, A.x - .8, A.y + .4, A.z + .8);

      const SA = Math.hypot(a / 2, a / 2, H);

      card(2, tr('مساحة المقطع', 'Aire de la section'), fmt(k * k * a * a, 2) + unit('cm²'));
      card(3, tr('حجم الهرم الصغير', 'Volume petite pyramide'), fmt(M.pyrVolume(k * a, k * H), 1) + unit('cm³'));
      const Vb = M.pyrVolume(a, H);
      if (recent('sep', 2500) && c.sep) notice(tr(`الهرم الصغير تصغير للكبير بنسبة k = ${fmt(k, 2)}: نفس الشكل ونفس الزوايا، وكل طول مضروب في k.`, `La petite pyramide est une réduction de la grande, de rapport k = ${fmt(k, 2)} : même forme, mêmes angles, chaque longueur × k.`));
      else if (Math.abs(k - .5) < .01) notice(tr(`عند k = 0,5: الضلع ÷ 2، والمساحة ÷ 4، والحجم ÷ 8. الهرم الكبير ${fmt(Vb, 1)} cm³ والصغير ${fmt(Vb / 8, 1)} cm³ فقط.`, `À k = 0,5 : côté ÷ 2, aire ÷ 4, volume ÷ 8. Grande pyramide ${fmt(Vb, 1)} cm³, petite ${fmt(Vb / 8, 1)} cm³ seulement.`));
      else notice(tr(`SA' = ${fmt(k * SA, 2)} cm و SA = ${fmt(SA, 2)} cm. المقطع مربع ضلعه k × 8 cm، ومساحته k² × 64 cm².`, `SA' = ${fmt(k * SA, 2)} cm et SA = ${fmt(SA, 2)} cm. La section est un carré de côté k × 8 cm et d'aire k² × 64 cm².`));
    }
  },

  /* 3 · fill an apex-down pyramid with copies of its reduction: 1 ÷ k³ pours */
  verser: {
    enter() { S.verser.anim = null; },
    sub(k) { Object.assign(S.verser, { k, n: 0, anim: null }); },
    actions() { const v = S.verser, full = v.n >= Math.round(M.pours(v.k)); return [['pour', tr('اسكب الهرم الصغير', 'Verser la petite pyramide'), full || v.anim ? '' : 'acc'], ['empty', tr('أفرغ', 'Vider')]]; },
    action(id) {
      const v = S.verser;
      if (id === 'empty') { v.n = 0; v.anim = null; act('empty'); return; }
      if (v.anim || v.n >= Math.round(M.pours(v.k))) return;
      v.anim = { t0: performance.now() }; act('pour');
    },
    draw(now) {
      const { a, H } = PYR, v = S.verser, k = v.k, total = Math.round(M.pours(k)), lift = 1.6;
      const apex = V3(C.x, PAGE_Y + lift, C.y), topY = PAGE_Y + lift + H;
      setPrism(prGlass, rep(apex, 4), sq(C, topY, a));
      sq(C, topY, a).forEach((p, i) => placeCyl(legs[i], V3(p.x + (p.x - C.x) * .15, PAGE_Y, p.z + (p.z - C.y) * .15), p, .12));
      legs.forEach(l => l.visible = true);
      // pour animation: 0 to 0.6 s move above, 0.6 to 1.8 s pour, 1.8 to 2.4 s back
      let f = v.n * k * k * k, mPos = V3(C.x + 7.5, PAGE_Y + 0.01, C.y), show = 1, pouring = false;
      if (v.anim) {
        const t = (now - v.anim.t0) / 1000, above = V3(C.x + 2.5, topY + 2, C.y);
        if (t < .6) mPos.lerpVectors(V3(C.x + 7.5, PAGE_Y + .01, C.y), above, ease(t / .6));
        else if (t < 1.8) { mPos.copy(above); pouring = true; const q = (t - .6) / 1.2; f += q * k * k * k; show = 1 - q; }
        else if (t < 2.4) { mPos.lerpVectors(above, V3(C.x + 7.5, PAGE_Y + .01, C.y), ease((t - 1.8) / .6)); f += k * k * k; show = 0; }
        else { v.n++; v.anim = null; f = v.n * k * k * k; act('poured'); buildHUD(); }
      }
      f = Math.min(1, f);
      const r = M.levelRatio(f);
      if (r > 0.001) setPrism(prWater, rep(apex, 4), sq(C, PAGE_Y + lift + r * H, r * a));
      // the measure: a reduction of ratio k, full while it waits, emptying while it pours
      const ka = k * a, kH = k * H;
      setPrism(prMeasure, sq(V(mPos.x, mPos.z), mPos.y, ka), rep(V3(mPos.x, mPos.y + kH, mPos.z), 4));
      prMeasure.mesh.material.opacity = .3 + .55 * show;
      stream.visible = pouring;
      if (pouring) placeCyl(stream, V3(C.x + 2.5 - ka / 2, topY + 2, C.y), V3(C.x + 1, PAGE_Y + lift + r * H, C.y), .18);
      drawLabel(`${v.n} / ${total}`, BLUE, C.x, topY + 1.6, C.y - a / 2 - 1, 1.6);
      card(0, 'k', k === .5 ? '½' : '⅓');
      card(1, tr('السكبات', 'Versements'), `${v.n}`);
      card(2, tr('الحجم المملوء', 'Volume rempli'), pct(f));
      card(3, tr('ارتفاع الماء', "Hauteur d'eau"), pct(r));
      if (v.n === 0 && !v.anim) notice(tr(`الهرم البرتقالي تصغير للهرم الشفاف بنسبة k = ${k === .5 ? '½' : '⅓'}. كم مرة نسكبه لملء الهرم الكبير؟ خمّن ثم اسكب.`, `La pyramide orange est une réduction de la grande, de rapport k = ${k === .5 ? '½' : '⅓'}. Combien de fois faut-il la verser pour remplir la grande ? Devine, puis verse.`));
      else if (v.n === 1 && !v.anim) notice(tr(`سكبة واحدة ملأت ${fmt(100 * r, 0)}% من الارتفاع، لكن ${fmt(100 * k * k * k, 1)}% فقط من الحجم.`, `Un seul versement remplit ${fmt(100 * r, 0)} % de la hauteur, mais seulement ${fmt(100 * k * k * k, 1)} % du volume.`));
      else if (v.n >= total) notice(tr(`امتلأ بعد ${total} سكبات: كل هرم صغير فيه k³ = 1 ÷ ${total} من الحجم.`, `Plein après ${total} versements : chaque petite pyramide contient k³ = 1/${total} du volume.`));
      else if (!v.anim) notice(tr(`${v.n} سكبات. الماء يصعد ببطء أكثر فأكثر لأن الهرم يتسع نحو الأعلى.`, `${v.n} versements. L'eau monte de plus en plus lentement : la pyramide s'élargit vers le haut.`));
    }
  },

  /* 4 · a cube enlarged by k is made of k³ unit cubes */
  cubes: {
    sub(k) { S.cubes.k = k; S.cubes.t0 = performance.now(); },
    actions: () => [['count', tr('عُدّ المكعبات', 'Compter les cubes'), 'acc']],
    action() { S.cubes.t0 = performance.now(); act('count'); },
    draw(now) {
      const k = S.cubes.k, n = k * k * k, x0 = 7, z0 = C.y - k * CUBE / 2;
      unitCube.visible = true; unitCube.position.set(3.5, PAGE_Y + CUBE / 2, C.y);
      const shown = Math.min(n, Math.floor((now - S.cubes.t0) / Math.max(60, 2400 / n)) + 1);
      let i = 0;
      for (let y = 0; y < k; y++) for (let z = 0; z < k; z++) for (let x = 0; x < k; x++) {
        const m = cubes[i]; m.visible = i < shown; m.position.set(x0 + (x + .5) * CUBE, PAGE_Y + (y + .5) * CUBE, z0 + (z + .5) * CUBE); i++;
      }
      drawLabel('×1', ORANGE, 3.5, PAGE_Y + CUBE + 1, C.y);
      drawLabel('×' + k, BLUE, x0 + k * CUBE / 2, PAGE_Y + k * CUBE + 1.2, C.y);
      card(0, tr('الحرف', 'Arête'), `${k * CUBE}` + unit('cm') + ` <i>(× ${k})</i>`);
      card(1, tr('مساحة وجه', "Aire d'une face"), `${k * k * CUBE * CUBE}` + unit('cm²') + ` <i>(× ${k * k})</i>`);
      card(2, tr('الحجم', 'Volume'), `${n * CUBE ** 3}` + unit('cm³') + ` <i>(× ${n})</i>`);
      card(3, tr('مكعبات صغيرة', 'Petits cubes'), `${shown}`);
      if (k === 1) notice(tr('k = 1: لا تكبير ولا تصغير، الشكل نفسه.', "k = 1 : ni agrandissement ni réduction, c'est la même figure."));
      else if (shown < n) notice(tr('نعدّ المكعبات الصغيرة...', 'On compte les petits cubes…'));
      else notice(tr(`ضربنا الحرف في ${k}: على الحرف ${k} مكعبات، وعلى الوجه ${k * k}، وفي المكعب كله ${n} = ${k}³.`, `Arête × ${k} : ${k} cubes sur une arête, ${k * k} sur une face, ${n} = ${k}³ dans tout le cube.`));
    }
  }
};

/* ---------- Frame loop ---------- */
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now();
  if (intro) { const q = Math.min(1, (now - intro.t0) / intro.dur), e = ease(q);
    camera.position.lerpVectors(intro.from, home.pos, e); camera.lookAt(home.target);
    if (q >= 1) { intro = null; orbit.enabled = true; orbit.target.copy(home.target); orbit.update(); } } else orbit.update();

  segUsed = labUsed = 0;
  for (const p of [prPaper, prSmall, prGlass, prWater, prFoot, prMeasure]) p.mesh.visible = p.edges.visible = false;
  cutPlane.visible = stem.visible = stream.visible = unitCube.visible = false;
  legs.forEach(l => l.visible = false); cubes.forEach(c => c.visible = false);

  MODES[S.mode].draw(now, dt);

  const sl = slider(), on = !!sl;
  knob.visible = trackMesh.visible = sliderPanel.m.visible = on;
  if (on) {
    const t = (sl.get() - sl.min) / (sl.max - sl.min), kx = TRACK.x0 + t * (TRACK.x1 - TRACK.x0);
    drawPanel(S.mode === 'verre' ? tr('ارتفاع الماء h ÷ H', "Hauteur de l'eau h ÷ H") : "k = SA' ÷ SA", sl.min, sl.max);
    knob.position.set(kx, PAGE_Y + 0.47, TRACK.z); knobHit.position.copy(knob.position);
    drawLabel(fmt(sl.get(), 2), RED, kx, PAGE_Y + 1.8, TRACK.z - 0.4);
  }
  for (let i = segUsed; i < segPool.length; i++) segPool[i].mesh.visible = false;
  for (let i = labUsed; i < labPool.length; i++) labPool[i].visible = false;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
window.__lesson = { M, S, MODES };
window.addEventListener('resize', resize);
resize(); buildHUD(); startIntro(); requestAnimationFrame(frame);
</script>
